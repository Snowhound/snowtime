# Applies the chosen branch's migrations to the staging database that every preview deployment
# shares (docs/migrations.md, "Staging"). Runs only when started from the Actions tab.
name: Migrate staging

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the GitHub environment "staging".
    environment: staging
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The version is packageManager in package.json, which vercel.json installs too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # db:migrate runs db:verify first, so a migration edited after it reached staging stops
      # it; reset staging then (docs/migrations.md, "Staging").
      - name: Migrate staging
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::error title=Staging secrets missing::Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the staging environment."
            exit 1
          fi
          bun run db:migrate
