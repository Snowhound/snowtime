# Applies a branch's migrations to the staging database that every preview deployment shares
# (docs/migrations.md, "Staging"): on each push that changes a migration, or from the Actions
# tab, for example after staging is reseeded.
name: Migrate staging

on:
  push:
    branches-ignore: [main]
    paths: ['drizzle/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: migrate-staging
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the GitHub environment "staging".
    environment: staging
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The version is packageManager in package.json, which vercel.json installs too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # db:migrate runs db:verify first, so a migration edited after it reached staging, or one
      # another branch applied, stops it; reseed staging then (docs/migrations.md, "Staging").
      # A fork or stack without staging skips visibly.
      - name: Migrate staging
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::notice title=Staging migration skipped::Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the staging environment."
            exit 0
          fi
          bun run db:migrate
