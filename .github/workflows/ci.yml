# Checks every PR and push to main; tests and db:drift use throwaway local databases. A push
# to main then migrates prod and deploys it (docs/architecture.md, "Environments and
# deployment").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels checks on a PR, never on main, where it would stop a migration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The version is packageManager in package.json, which vercel.json installs too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit -p .

      - name: Unused files, exports, and dependencies
        run: bun run knip

      - name: Test
        run: bun test

      - name: Component tests
        run: bunx vitest run

      # Bundle budgets, query plans, and report reads against perf/baselines/ (perf/README.md).
      - name: Performance budgets
        run: bun run perf

      # Drift is a warning by decision (docs/architecture.md, "Schema and migrations"): the
      # script exits 0 on drift and fails only when the migrations fail on an empty database.
      - name: Schema drift
        run: |
          bun run db:drift 2>&1 | tee drift.log
          if grep -q 'WARNING' drift.log; then
            echo "::warning title=Schema drift::schema.ts differs from the migrations; see the Schema drift step."
          fi

      - name: Data model diagram is current
        run: bun run datamodel:check

  migrate-prod:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the GitHub environment "production". One migration at a time.
    environment: production
    concurrency:
      group: migrate-prod
      cancel-in-progress: false
    outputs:
      migrated: ${{ steps.migrate.outputs.migrated }}
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The version is packageManager in package.json, which vercel.json installs too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # db:migrate runs db:verify first, so an edited applied migration stops it. Until the
      # secrets are set, the step skips visibly rather than fail every push to main.
      - name: Migrate prod
        id: migrate
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::notice title=Prod migration skipped::Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the production environment."
            exit 0
          fi
          bun run db:migrate
          echo "migrated=true" >> "$GITHUB_OUTPUT"

  # vercel.json keeps Vercel from deploying main by itself, so new code goes live only after
  # the checks pass and its migrations apply. A skipped migration skips the deploy too.
  deploy-prod:
    needs: migrate-prod
    if: needs.migrate-prod.outputs.migrated == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      # Uploads the source; Vercel builds it with the project's environment variables, and the
      # CLI waits for the build and fails with it.
      - name: Deploy prod
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning title=Prod deploy skipped::Set VERCEL_TOKEN, VERCEL_ORG_ID, and VERCEL_PROJECT_ID in the production environment."
            exit 0
          fi
          npx --yes vercel@60.1.3 deploy --prod --yes --token "$VERCEL_TOKEN"
