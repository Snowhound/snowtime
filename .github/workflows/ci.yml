# Checks every PR and push to main; tests and db:drift use throwaway local databases. A push
# to main then migrates prod (docs/architecture.md, "Environments and deployment").
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push cancels checks on a PR, never on main, where it would stop a migration.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The version is packageManager in package.json, which vercel.json installs too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      - name: Format
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Type check
        run: bunx tsc --noEmit -p .

      - name: Test
        run: bun test

      - name: Component tests
        run: bunx vitest run

      # Drift is a warning by decision (docs/architecture.md, "Schema and migrations"): the
      # script exits 0 on drift and fails only when the migrations fail on an empty database.
      - name: Schema drift
        run: |
          bun run db:drift 2>&1 | tee drift.log
          if grep -q 'WARNING' drift.log; then
            echo "::warning title=Schema drift::schema.ts differs from the migrations; see the Schema drift step."
          fi

      - name: Data model diagram is current
        run: bun run datamodel:check

  migrate-prod:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secrets live in the GitHub environment "production". One migration at a time.
    environment: production
    concurrency:
      group: migrate-prod
      cancel-in-progress: false
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      # The version is packageManager in package.json, which vercel.json installs too.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install
        run: bun install --frozen-lockfile

      # db:migrate runs db:verify first, so an edited applied migration stops it. Until the
      # secrets are set, the step skips visibly rather than fail every push to main.
      - name: Migrate prod
        run: |
          if [ -z "$TURSO_DATABASE_URL" ] || [ -z "$TURSO_AUTH_TOKEN" ]; then
            echo "::notice title=Prod migration skipped::Set TURSO_DATABASE_URL and TURSO_AUTH_TOKEN in the production environment."
            exit 0
          fi
          bun run db:migrate
