[package]
name = "snowtime-axum"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# One binary per query layer; a feature builds only its rules crate.
[features]
default = ["sql"]
sql = ["dep:snowtime-rules-sql"]
seaquery = ["dep:snowtime-rules-seaquery"]

[[bin]]
name = "snowtime-axum"
path = "src/bin/sql.rs"
required-features = ["sql"]

[[bin]]
name = "snowtime-axum-seaquery"
path = "src/bin/seaquery.rs"
required-features = ["seaquery"]

[dependencies]
axum.workspace = true
snowtime-api.workspace = true
snowtime-core.workspace = true
snowtime-rules-seaquery = { workspace = true, optional = true }
snowtime-rules-sql = { workspace = true, optional = true }
tokio.workspace = true
