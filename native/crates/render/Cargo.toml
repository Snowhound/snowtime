[package]
name = "snowtime-render"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
deno_core = "0.405"
deno_error = "0.7"
deno_web = "0.283"
deno_webidl = "0.252"
deno_fetch = "0.276"
deno_net = "0.244"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync", "time", "macros", "net"] }
reqwest = { version = "0.12", default-features = false }
anyhow = "1"
libc = "0.2"

[build-dependencies]
deno_core = "0.405"
deno_web = "0.283"
deno_webidl = "0.252"
deno_fetch = "0.276"
deno_net = "0.244"
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
axum = "0.8"
actix-web = "4"
tokio-stream = "0.1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
