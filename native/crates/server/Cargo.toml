[package]
name = "snowtime-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
bench = []
auth-spike = [
  "dep:better-auth",
  "dep:better-auth-core",
  "dep:async-trait",
  "dep:chrono",
]
scrypt-bench = ["dep:scrypt"]

[dependencies]
async-trait = { version = "0.1", optional = true }
aws-lc-sys = "0.45"
axum.workspace = true
base64.workspace = true
better-auth = { version = "=1.0.0-alpha.3", default-features = false, features = [
  "rustls",
], optional = true }
better-auth-core = { version = "=1.0.0-alpha.3", optional = true }
chrono = { version = "0.4", features = ["serde"], optional = true }
form_urlencoded.workspace = true
hmac.workspace = true
icu_collator.workspace = true
icu_locale_core.workspace = true
jiff.workspace = true
libc = "0.2"
openssl = { version = "0.10", features = ["vendored"] }
rand.workspace = true
regex = "1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "json"] }
rusqlite.workspace = true
rustc-hash.workspace = true
scrypt = { workspace = true, optional = true }
serde.workspace = true
serde_cbor_2 = { version = "0.13" }
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
tower = { version = "0.5", features = ["util"] }
unicode-normalization.workspace = true
url = "2"
uuid.workspace = true
webauthn-rs-core = { version = "=0.5.5" }

[[example]]
name = "scrypt-bench"
required-features = ["scrypt-bench"]
