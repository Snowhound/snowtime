# The native backend's proof of concept (task 081): one crate per candidate library and the
# crates they share. native/README.md says how to build, run, and measure them.
[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
snowtime-core = { path = "crates/core" }
snowtime-auth = { path = "crates/auth" }
snowtime-api = { path = "crates/api" }
snowtime-rules-sql = { path = "crates/rules-sql" }
snowtime-rules-seaquery = { path = "crates/rules-seaquery" }

axum = "0.8"
base64 = "0.23"
form_urlencoded = "1"
hmac = "0.13"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled"] }
rustc-hash = "2"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }
