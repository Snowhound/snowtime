[workspace]
resolver = "3"
members = ["crates/*"]
# The render crate needs its JavaScript bundle built first (crates/render/README.md).
default-members = ["crates/server", "crates/host"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
snowtime-server = { path = "crates/server" }

axum = "0.8"
base64 = "0.23"
form_urlencoded = "1"
hmac = "0.13"
rand = "0.10"
rusqlite = { version = "0.40", features = ["bundled", "trace"] }
rustc-hash = "2"
scrypt = { version = "0.12", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v7"] }
