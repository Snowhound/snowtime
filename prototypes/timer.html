<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timer and entries</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="prototype-theme.js"></script>
    <script src="ui.js"></script>
    <script src="app-icon.js"></script>
    <script src="seasons.js"></script>
    <script src="scene.js"></script>
    <script src="intro.js"></script>
    <script src="app-frame.js"></script>
    <style type="text/tailwindcss">
      /* "One alert, marked rows": what isn't saved yet carries a muted bar at its start. */
      body[data-pending-ui='marked'] [data-row][data-pending] {
        @apply bg-muted/50 shadow-[inset_3px_0_0_var(--muted-foreground)];
      }
      body[data-pending-ui='marked'] #timer[data-pending] {
        @apply shadow-[inset_3px_0_0_var(--muted-foreground)];
      }
      /* Timer controls share one DOM across designs; only layout changes. */
      body[data-design='bar'] .timer {
        @apply flex flex-col gap-3 rounded-xl border bg-card p-3 shadow-sm sm:flex-row sm:items-center;
      }
      body[data-design='bar'] .timer-elapsed {
        @apply justify-start text-lg sm:w-28 sm:justify-end;
      }
      body[data-design='focus'] .timer {
        @apply grid grid-cols-1 gap-4 rounded-xl border bg-card p-6 shadow-sm sm:grid-cols-[minmax(0,1fr)_auto];
      }
      body[data-design='focus'] .timer-elapsed {
        @apply order-first h-auto justify-self-start text-5xl font-light tracking-tight sm:col-span-2 sm:text-6xl;
      }
      body[data-design='focus'] .timer-fields {
        @apply sm:col-start-1;
      }
      body[data-design='focus'] .timer-toggle {
        @apply h-12 sm:w-36;
      }
      body[data-design='table'] .timer {
        @apply flex flex-col gap-2 border-b pb-4 sm:flex-row sm:items-center;
      }
      body[data-design='table'] .timer-elapsed {
        @apply justify-start text-base sm:w-24 sm:justify-end;
      }
      /* Over the scene, the table layout's timer gets a card of its own, like the other layouts'. */
      body[data-scene-bg='on'][data-design='table'] .timer {
        @apply rounded-lg border bg-card p-3;
      }
      /* The header's width, with the timer beside the summary and each row's chip after its text;
         or, with the Wide page setting, up to 88rem, the timer across the summary column, and a
         Ticket column in the rows. */
      body[data-width='wide'] .timer-page {
        @apply max-w-[88rem];
      }
      body[data-width='standard'] .timer-page {
        @apply max-w-6xl;
      }
      body[data-width='wide'] #timer {
        @apply col-[1/-1];
      }
      body[data-width='standard'] main {
        @apply lg:grid-rows-[auto_1fr];
      }
      body[data-width='standard'] #timer {
        @apply lg:col-start-1 lg:row-start-1;
      }
      body[data-width='standard'] #entries-column {
        @apply lg:col-start-1 lg:row-start-2;
      }
      body[data-width='standard'] #summary-panel {
        @apply lg:col-start-2 lg:row-span-2 lg:row-start-1 lg:self-start;
      }
      body:not([data-design='focus']) .focus-only,
      body[data-summary='off'] #summary-panel {
        display: none;
      }
      body[data-summary='off'] main {
        @apply lg:grid-cols-[minmax(0,1fr)];
      }
      .entry-actions {
        @apply flex items-center gap-1 sm:opacity-0 sm:transition-opacity sm:group-hover:opacity-100 sm:group-focus-within:opacity-100;
      }
      /* Inline time fields are typed; the picker button only widens them. */
      .inline-time::-webkit-calendar-picker-indicator {
        display: none;
      }
      /* Marks a row that moved to another day or was just added. */
      @keyframes entry-flash {
        from {
          background-color: var(--accent);
        }
      }
      .entry-flash {
        animation: entry-flash 1.6s ease-out;
      }
      /* A description field with the entry's ticket chip at its end, drawn as one input. */
      .ticket-field {
        @apply flex min-h-10 w-full min-w-0 cursor-text flex-wrap items-center gap-1 rounded-md py-1 border border-input bg-transparent pl-2 pr-3 text-sm ring-offset-background focus-within:ring-2 focus-within:ring-ring focus-within:ring-offset-2;
      }
      .ticket-field:has(.ticket) {
        @apply pr-1.5;
      }
      .ticket-field > input {
        @apply h-8 min-w-24 flex-1 bg-transparent pl-1 outline-none placeholder:text-muted-foreground;
      }
      /* In rows, the remove button stays visible and brightens on hover and focus. */
      .entry-ticket-remove {
        @apply sm:opacity-50 sm:transition-opacity sm:group-hover:opacity-100 sm:group-focus-within:opacity-100;
      }
    </style>
    <link rel="stylesheet" href="prototype.css" />
  </head>
  <body data-design="bar" class="bg-muted/40">
    <div id="prototype-controls">
      <label for="fixture" class="sr-only">Fixture</label>
      <select id="fixture" data-ui="select" class="h-9 w-40">
        <option value="running">Running</option>
        <option value="idle">Idle</option>
        <option value="long">Long content</option>
        <option value="empty">Empty</option>
      </select>
      <label for="issue-links" class="sr-only">Issue links</label>
      <select id="issue-links" data-ui="select" class="h-9 w-40" title="The organization's Issue links setting (Organization, General)">
        <option value="">No issue links</option>
        <option value="https://snowhound.atlassian.net/browse/{key}">Jira links</option>
        <option value="https://linear.app/snowhound/issue/{key}">Linear links</option>
      </select>
      <label class="flex items-center gap-2 text-sm" title="Prototype only: inline saves fail and roll back">
        <input id="fail-saves" type="checkbox" data-ui="checkbox" />Fail saves
      </label>
      <label class="flex items-center gap-2 text-sm" title="Prototype only: the server refuses every write with 503 until this is off">
        <input id="server-busy" type="checkbox" data-ui="checkbox" />Server busy
      </label>
      <label for="pending-ui" class="sr-only">Pending changes</label>
      <select id="pending-ui" data-ui="select" class="h-9 w-48" title="How refused changes show">
        <option value="one">One alert</option>
        <option value="each">Alert per change</option>
        <option value="marked">One alert, marked rows</option>
      </select>
    </div>

    <div id="pending" class="timer-page mx-auto px-4 sm:px-8"></div>

    <div class="timer-page mx-auto flex flex-wrap items-center justify-between gap-x-4 gap-y-3 px-4 pt-6 sm:px-8">
      <h1 class="text-2xl font-semibold tracking-tight">Timer</h1>
      <div class="flex items-center gap-2">
        <!-- The view switch leads the actions, set apart from them. -->
        <div data-ui="toggle-group" role="group" class="mr-2" aria-label="Entries as">
          <button type="button" data-ui="toggle" data-variant="outline" data-view="list" aria-pressed="true" data-pressed class="gap-1.5">
            <svg class="prototype-icon" aria-hidden="true"><use href="#icon-list" /></svg>List
          </button>
          <button type="button" data-ui="toggle" data-variant="outline" data-view="calendar" aria-pressed="false" class="gap-1.5">
            <svg class="prototype-icon" aria-hidden="true"><use href="#icon-calendar-days" /></svg>Calendar
          </button>
        </div>
        <button id="add-entry" type="button" data-ui="button" data-variant="outline" class="h-9" popovertarget="entry-popover">
          <svg class="prototype-icon" aria-hidden="true"><use href="#icon-plus" /></svg>Add entry
        </button>
        <button data-ui="button" data-variant="outline" data-size="icon" class="size-9" popovertarget="view-settings" aria-label="View settings">
          <svg class="prototype-icon" aria-hidden="true"><use href="#icon-settings" /></svg>
        </button>
      </div>
      <div id="view-settings" popover data-ui="popover" class="grid gap-4" role="dialog" aria-labelledby="view-settings-title">
        <h2 id="view-settings-title" class="font-medium leading-none">View</h2>
        <div class="grid gap-2">
          <span data-ui="label" id="layout-label">Layout</span>
          <div data-ui="toggle-group" class="justify-start" role="group" aria-labelledby="layout-label">
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="design" data-value="bar">Bar</button>
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="design" data-value="focus">Focus</button>
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="design" data-value="table">Table</button>
          </div>
        </div>

        <div class="flex items-center justify-between gap-4">
          <span data-ui="label" id="summary-label">Show summary</span>
          <button id="summary-switch" type="button" role="switch" aria-checked="true" aria-labelledby="summary-label" data-ui="switch">
            <span data-ui="switch-thumb"></span>
          </button>
        </div>
        <div class="flex items-center justify-between gap-4">
          <div class="grid gap-1">
            <span data-ui="label" id="wide-label">Wide page</span>
            <span class="text-xs text-muted-foreground" id="wide-hint">More room for descriptions, with tickets in their own column.</span>
          </div>
          <button id="wide-switch" type="button" role="switch" aria-checked="false" aria-labelledby="wide-label" aria-describedby="wide-hint" data-ui="switch">
            <span data-ui="switch-thumb"></span>
          </button>
        </div>
        <div data-ui="separator"></div>
        <a href="settings.html#preferences" data-frame-link="settings.html#preferences" data-ui="button" data-variant="link" data-size="sm" class="h-auto justify-start p-0">All settings</a>
      </div>
    </div>

    <main class="timer-page mx-auto grid grid-cols-[minmax(0,1fr)] gap-6 px-4 pb-6 pt-4 sm:px-8 lg:grid-cols-[minmax(0,1fr)_auto]">
      <section id="timer" class="timer surface" aria-label="Timer">
        <div class="timer-fields flex min-w-0 flex-1 flex-col gap-2 sm:flex-row sm:items-center">
          <label for="description" class="sr-only">What are you working on?</label>
          <div id="description-field" class="ticket-field flex-1" data-ticket-owner="timer">
            <input id="description" type="text" placeholder="What are you working on?" autocomplete="off" />
            <span id="description-ticket" class="contents"></span>
            <button type="button" data-ui="button" data-variant="ghost" data-size="sm" data-add-issue="timer" class="h-7 shrink-0 px-2 text-xs text-muted-foreground">Add issue</button>
          </div>
          <label for="project" class="sr-only">Project</label>
          <select id="project" data-ui="select" class="sm:w-48"></select>
        </div>
        <button id="elapsed" type="button" data-ui="button" data-variant="ghost" class="timer-elapsed px-2 tabular-nums" aria-label="Edit start time" popovertarget="entry-popover" disabled>0:00:00</button>
        <button id="toggle" data-ui="button" class="timer-toggle" type="button"></button>
      </section>

      <div id="entries-column" class="flex min-w-0 flex-col gap-6">

        <section class="focus-only" aria-labelledby="recent-heading">
          <h2 id="recent-heading" class="mb-2 text-sm font-medium text-muted-foreground">Continue recent</h2>
          <div id="recent" class="flex flex-wrap gap-2"></div>
        </section>

        <section id="entries" aria-label="Time entries" class="flex min-w-0 flex-col gap-4"></section>
      </div>

      <aside id="summary-panel" class="w-full lg:w-72" aria-labelledby="summary-heading">
        <div data-ui="card">
          <div data-ui="card-header"><h2 id="summary-heading" data-ui="card-title">Summary</h2></div>
          <div id="summary" data-ui="card-content" class="flex flex-col gap-4"></div>
        </div>
      </aside>
    </main>

    <div id="issue-picker" popover data-ui="popover" role="dialog" aria-labelledby="issue-picker-title" class="w-80 max-w-[calc(100vw-16px)]">
      <form id="issue-form" class="grid gap-3">
        <h2 id="issue-picker-title" class="font-medium">Add issue</h2>
        <div class="grid gap-1.5">
          <label data-ui="label" for="issue-key">Issue key or URL</label>
          <input id="issue-key" data-ui="input" placeholder="SNOW-161 or an issue URL" autocomplete="off" aria-describedby="issue-error" />
          <p id="issue-error" class="text-xs text-destructive" role="alert" hidden>Enter an issue key such as SNOW-161 or an issue URL.</p>
        </div>
        <div class="grid gap-1"><p class="text-xs text-muted-foreground">Issues from loaded entries</p><div id="recent-issues" class="grid max-h-48 overflow-y-auto"></div></div>
        <div class="flex justify-end gap-2"><button type="button" id="issue-cancel" data-ui="button" data-variant="ghost" data-size="sm">Cancel</button><button data-ui="button" data-size="sm">Add issue</button></div>
      </form>
    </div>
    <div id="entry-popover" popover data-ui="popover" role="dialog" aria-labelledby="entry-popover-title" aria-describedby="entry-popover-description" class="max-h-[calc(100dvh-16px)] w-[28rem] overflow-y-auto">
      <form id="entry-form" class="grid gap-4" novalidate>
        <div class="grid gap-1.5">
          <h2 id="entry-popover-title" class="font-medium leading-none">Add entry</h2>
          <p id="entry-popover-description" class="text-sm text-muted-foreground"></p>
        </div>
        <div class="grid gap-1.5">
          <label data-ui="label" for="edit-description">Description</label>
          <div id="edit-description-field" class="ticket-field" data-ticket-owner="editor">
            <input id="edit-description" type="text" autocomplete="off" placeholder="What did you work on?" />
            <span id="edit-description-ticket" class="contents"></span>
          </div>
        </div>
        <div class="grid gap-1.5">
          <label data-ui="label" for="edit-project">Project</label>
          <select id="edit-project" data-ui="select"></select>
        </div>
        <div class="grid grid-cols-2 gap-4 sm:grid-cols-3">
          <div class="col-span-2 grid gap-1.5 sm:col-span-1">
            <label data-ui="label" for="edit-date">Date</label>
            <input id="edit-date" data-ui="input" type="date" required />
          </div>
          <div class="grid gap-1.5">
            <label data-ui="label" for="edit-start">Start</label>
            <input id="edit-start" data-ui="input" type="time" required />
          </div>
          <div class="grid gap-1.5" id="edit-end-field">
            <label data-ui="label" for="edit-end">End</label>
            <input id="edit-end" data-ui="input" type="time" required />
          </div>
        </div>
        <p id="edit-summary" class="-mt-1 text-sm text-muted-foreground" aria-live="polite"></p>
        <p id="edit-error" data-ui="error-message" class="-mt-3" role="alert" hidden></p>
        <div class="flex justify-end gap-2">
          <button type="button" data-ui="button" data-variant="outline" data-size="sm" data-entry-cancel>Cancel</button>
          <button type="submit" data-ui="button" data-size="sm">Save</button>
        </div>
      </form>
    </div>

    <script>
      // The Timer page opens as the user left it: the list here, or the week calendar.
      if (location.hash === '#list') appFrame.settings.set({ timerView: 'list' })
      else if (appFrame.settings.get().timerView === 'calendar') location.replace(appFrame.link('calendar.html'))
      appFrame.mount({ page: 'timer', title: 'Timer and entries', scene: true })
      document.querySelector('[data-view="calendar"]').addEventListener('click', () => {
        appFrame.settings.set({ timerView: 'calendar' })
        location.href = appFrame.link('calendar.html')
      })

      const DAY = 86_400_000
      const HOUR = 3_600_000
      const MIN = 60_000

      const projects = [
        { id: 'none', name: 'No project', color: 'transparent' },
        { id: 'p1', name: 'Snowtime', color: 'var(--series-1)' },
        { id: 'p2', name: 'Client portal', color: 'var(--series-3)' },
        { id: 'p3', name: 'Internal', color: 'var(--series-4)' },
        { id: 'p4', name: 'Nordic Logistics – warehouse management system migration', color: 'var(--series-8)' },
        { id: 'p5', name: 'Website 2025', color: 'var(--series-6)', archived: true },
      ]
      const activeProjects = projects.filter((p) => p.id !== 'none' && !p.archived)

      const state = { entries: [], running: null }
      let nextId = 1

      const startOfDay = (t) => {
        const d = new Date(t)
        d.setHours(0, 0, 0, 0)
        return d.getTime()
      }
      // Week starts Monday (user setting in the app).
      const startOfWeek = (t) => {
        const d = new Date(startOfDay(t))
        return d.getTime() - ((d.getDay() + 6) % 7) * DAY
      }

      function entry(dayOffset, startHour, minutes, description, projectId, ticket = null) {
        const start = startOfDay(Date.now()) - dayOffset * DAY + startHour * HOUR
        return { id: `e${nextId++}`, description, projectId, ticket, startedAt: start, stoppedAt: start + minutes * MIN }
      }

      const fixtures = {
        running() {
          return {
            entries: [
              entry(0, 8.5, 55, 'Standup and planning', 'p3'),
              entry(0, 9.5, 95, 'Timer schema and the partial unique index for one running timer', 'p1', 'SNOW-142'),
              // Crosses midnight into today; grouped under its start day.
              entry(1, 23, 100, 'Deploy window for the reporting release', 'p1', 'SNOW-150'),
              entry(1, 9, 30, 'Standup and planning', 'p3'),
              // A key mid-sentence: a ticket, and the sentence keeps it.
              entry(1, 9.75, 180, 'Pair with Erik on CP-91 flaky checkout tests, then invoice export review', 'p2', 'CP-91'),
              entry(1, 13.5, 70, '', 'none'),
              // A second key stays text: an entry has one ticket.
              entry(2, 9, 120, 'Merge duplicate members, then SNOW-153 sorting by name', 'p1', 'SNOW-151'),
              // Archived project: listed in the picker as "(archived)" so other edits keep it.
              entry(2, 14, 45, 'Landing page copy fixes', 'p5', 'WEB-77'),
              // Looked like a key; its chip was turned back into text, so it isn't detected again.
              entry(3, 9, 60, 'Q3-2026 roadmap review with the leads', 'p3'),
              entry(3, 10.5, 240, 'Report time zone boundaries at daylight saving changes', 'p1', 'SNOW-138'),
            ],
            running: { id: `e${nextId++}`, description: 'Ticket chips in the timer and entry rows', projectId: 'p1', ticket: 'SNOW-160', startedAt: Date.now() - 25 * MIN - 12_000 },
          }
        },
        idle() {
          return { entries: fixtures.running().entries, running: null }
        },
        long() {
          const long =
            'Workshop with the logistics team about migrating legacy warehouse stock adjustments, including edge cases for partial deliveries'
          const tickets = ['LOGISTICS-10482', 'LOGISTICS-10490', 'WMS-2207']
          const entries = []
          for (let day = 0; day < 6; day++)
            for (let i = 0; i < 5; i++)
              entries.push(entry(day, 8 + i * 1.75, 40 + i * 13, i % 2 ? long : 'Code review', i % 2 ? 'p4' : 'p2', i % 2 ? tickets[day % 3] : null))
          // A project the user can no longer see (its teams changed).
          entries.push(entry(1, 18, 35, 'Estimate for the tender', 'p-hidden'))
          // Only a ticket, no description.
          entries.push(entry(2, 18, 20, '', 'p2', 'CP-104'))
          return { entries, running: { id: `e${nextId++}`, description: long, projectId: 'p4', ticket: 'LOGISTICS-10482', startedAt: Date.now() - 9 * HOUR - 3 * MIN } }
        },
        empty() {
          return { entries: [], running: null }
        },
      }

      const { escapeHtml, icon } = appFrame
      const project = (id) =>
        projects.find((p) => p.id === id) ?? { id, name: 'Unavailable project', color: 'var(--muted-foreground)', unavailable: true }
      // "No project", the active projects, and the entry's archived or unavailable project, as ProjectSelect lists them.
      function projectChoices(currentId) {
        const current = project(currentId)
        const choices = [projects[0], ...activeProjects]
        if (current.archived) choices.push({ ...current, name: `${current.name} (archived)` })
        if (current.unavailable) choices.push(current)
        return choices
      }
      const projectOptions = (currentId) =>
        projectChoices(currentId)
          .map((p) => `<option value="${p.id}"${p.id === currentId ? ' selected' : ''}>${escapeHtml(p.name)}</option>`)
          .join('')
      const dot = (p) =>
        p.id === 'none' ? '' : `<span class="inline-block size-2 shrink-0 rounded-full" style="background:${p.color}"></span>`
      const timeFmt = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' })
      const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short' })

      function duration(ms, seconds = true) {
        const total = Math.max(0, Math.floor(ms / 1000))
        const h = Math.floor(total / 3600)
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0')
        const s = String(total % 60).padStart(2, '0')
        return seconds ? `${h}:${m}:${s}` : `${h}:${m}`
      }
      function dayLabel(t) {
        const diff = Math.round((startOfDay(Date.now()) - startOfDay(t)) / DAY)
        return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : dayFmt.format(t)
      }
      const entryDuration = (e) => (e.stoppedAt ?? Date.now()) - e.startedAt
      const describe = (e) =>
        e.description ? escapeHtml(e.description) : '<span class="text-muted-foreground italic">No description</span>'
      const name = (e) => escapeHtml([e.ticket, e.description].filter(Boolean).join(' ') || 'entry')

      // Ticket keys as Jira, Linear, and YouTrack write them: a letter, one to nine more letters
      // or digits, a dash, and a number.
      const KEY = String.raw`[A-Z][A-Z0-9]{1,9}-[1-9]\d{0,6}`
      const KEYS = new RegExp(String.raw`(?<![\w-])${KEY}(?![\w-])`, 'g')
      // A key at the start, optionally in brackets, and the separator after it.
      const LEADING = new RegExp(String.raw`^\[?(${KEY})\]?(?:\s*[:|,/–—-]\s*|\s+|$)`)
      // A pasted issue link becomes its key.
      const ISSUE_LINK = new RegExp(String.raw`https?://\S+?/(?:browse|issues?)/(${KEY})(?![\w-])\S*`, 'gi')
      // Standards whose names look like keys.
      const NOT_TICKETS = new Set(['UTF', 'ISO', 'SHA', 'COVID'])
      const keysIn = (text) => [...text.matchAll(KEYS)].map((m) => m[0])

      // Runs when a description is committed (Enter, blur, Save). An entry has one ticket. A
      // key at the start becomes it and leaves the text, replacing any ticket the entry had; a
      // key later in the text becomes it only when there is none, and stays so the sentence
      // still reads. Other keys stay text. Keys in `known`, the ones the saved text already
      // had, stay text too; that is how a chip turned back into text isn't found again.
      function detectTicket(text, known, ticket) {
        const description = text.replace(ISSUE_LINK, (_, key) => key.toUpperCase()).trim()
        const fresh = (key) => !known.has(key) && !NOT_TICKETS.has(key.split('-')[0])
        const lead = description.match(LEADING)
        if (lead && fresh(lead[1])) return { description: description.slice(lead[0].length).trim(), ticket: lead[1] }
        return { description, ticket: ticket ?? keysIn(description).find(fresh) ?? null }
      }
      // A chip's × turns the key back into text: the entry has no ticket, and the key goes back
      // to the start of the text unless the text still has it.
      function untick(key, text) {
        return { description: keysIn(text).includes(key) ? text : `${key} ${text}`.trim(), ticket: null }
      }

      // The organization's Issue links setting: a URL with {key}, or empty for plain labels.
      let issueLinks = ''
      function ticketChip(key, owner, { row = false, inline = false } = {}) {
        const href = issueLinks && issueLinks.replace('{key}', encodeURIComponent(key))
        const label = href
          ? `<a href="${escapeHtml(href)}" target="_blank" rel="noopener noreferrer" title="Open ${key}" class="min-w-0 truncate rounded-sm underline decoration-foreground/30 underline-offset-2 hover:decoration-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring">${key}</a>`
          : `<span class="min-w-0 truncate" title="${key}">${key}</span>`
        return `<span data-ui="badge" data-variant="secondary" class="ticket h-6 min-w-0 ${inline ? 'max-w-[60%]' : 'max-w-full'} shrink-0 gap-0.5 pl-1.5 pr-0.5 tabular-nums">${label}<button type="button" data-untick="${key}" data-owner="${owner}"
          class="${row ? 'entry-ticket-remove ' : ''}inline-flex size-5 shrink-0 items-center justify-center rounded-sm text-muted-foreground hover:bg-background hover:text-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
          aria-label="Turn ${key} back into text" title="Turn back into text">${icon('x', 'size-3')}</button></span>`
      }
      // The ticket in a suggestion or a Continue recent chip: a label only.
      const ticketLabel = (ticket, query = '') =>
        ticket ? `<span data-ui="badge" data-variant="secondary" class="h-5 shrink-0 px-1.5 font-medium tabular-nums">${highlight(ticket, query)}</span>` : ''

      function groupByDay(entries) {
        const groups = new Map()
        for (const e of [...entries].sort((a, b) => b.startedAt - a.startedAt)) {
          const key = startOfDay(e.startedAt)
          if (!groups.has(key)) groups.set(key, [])
          groups.get(key).push(e)
        }
        return [...groups.entries()].map(([day, items]) => ({ day, items, total: items.reduce((s, e) => s + entryDuration(e), 0) }))
      }

      // data-entry and data-key let a re-render put focus back on the same control.
      function actions(e) {
        return `<div class="entry-actions">
          <button data-ui="button" data-variant="ghost" data-size="icon" data-continue="${e.id}" data-entry="${e.id}" data-key="continue" aria-label="Continue ${name(e)}">${icon('play')}</button>
          <button data-ui="button" data-variant="ghost" data-size="icon" data-delete="${e.id}" data-entry="${e.id}" data-key="delete" aria-label="Delete ${name(e)}">${icon('trash-2')}</button>
        </div>`
      }

      function emptyState() {
        return `<div class="surface flex flex-col items-center gap-2 rounded-xl border border-dashed bg-background px-6 py-12 text-center">
          ${icon('clock', 'size-6 text-muted-foreground')}
          <p class="font-medium">No time tracked yet</p>
          <p class="text-sm text-muted-foreground">Start the timer above. Entries appear here grouped by day.</p>
        </div>`
      }

      // Inline editing. Every field is a control that reads as text until hovered or focused; a
      // committed field saves on its own. Below 768 px the row's fields stack on three lines.
      const inline = {
        // Unsaved values per entry: description, start, end. Invalid times stay here until fixed or Escape.
        drafts: {},
        // Per entry: { kind: 'invalid', key, message } or { kind: 'failed', message }.
        errors: {},
        flash: null,
      }
      const QUIET = 'border-transparent shadow-none hover:border-input focus-visible:border-input'
      const find = (id) => state.entries.find((x) => x.id === id)
      const draft = (id, key) => inline.drafts[id]?.[key]
      function clearDraft(id, ...keys) {
        for (const key of keys) delete inline.drafts[id]?.[key]
        if (inline.drafts[id] && !Object.keys(inline.drafts[id]).length) delete inline.drafts[id]
      }

      // The ticket column: a fixed width after the description, so every row's text starts in
      // the same place; a link adds an issue when the cell is empty.
      function ticketCell(e, { inline = false } = {}) {
        return e.ticket ? ticketChip(e.ticket, e.id, { row: true, inline }) : inline ? '' : `<button type="button" data-ui="button" data-variant="link" data-size="sm" data-add-issue="${e.id}" class="h-7 px-1 text-xs text-muted-foreground">Add issue</button>`
      }

      // The input fills the cell and the chip sits at its end, where every row's chip lines up.
      // With Wide page the chip moves to the Ticket column from 1280 px and to the project's
      // line below 768 px (`hide`).
      function inlineDescription(e, hide = '') {
        return `<div class="flex min-w-0 items-center gap-1">
          <div class="min-w-0 flex-1">${descriptionInput(e)}</div>
          <span class="contents ${hide}">${ticketCell(e, { inline: true })}</span>
        </div>`
      }

      function descriptionInput(e) {
        return `<input data-ui="input" type="text" autocomplete="off" data-entry="${e.id}" data-key="description" aria-label="Description" placeholder="No description"
          value="${escapeHtml(draft(e.id, 'description') ?? e.description)}" class="h-8 px-2 text-ellipsis ${QUIET}" />`
      }

      function timeInput(e, key) {
        const err = inline.errors[e.id]
        const invalid = err?.kind === 'invalid' && err.key === key
        const value = draft(e.id, key) ?? toTimeValue(key === 'start' ? e.startedAt : e.stoppedAt)
        return `<input data-ui="input" type="time" required data-entry="${e.id}" data-key="${key}" aria-label="${key === 'start' ? 'Start' : 'End'}" value="${value}"
          aria-describedby="error-${e.id}"${invalid ? ' data-invalid aria-invalid="true"' : ''} class="inline-time h-8 w-auto px-1.5 text-xs tabular-nums [field-sizing:content] ${QUIET}" />`
      }

      function nextDayMark(e) {
        const r = readTimes(e, rowValues(e))
        return `<span data-next-day="${e.id}" class="w-5 text-xs text-muted-foreground" title="Ends the next day">${!r.error && r.nextDay ? '+1' : ''}</span>`
      }

      function durationCell(e, cls) {
        const r = readTimes(e, rowValues(e))
        return `<span data-duration="${e.id}" class="${cls}">${r.error ? '—' : duration(r.stoppedAt - r.startedAt)}</span>`
      }

      // The date lives in a popover: moving an entry to another day is rare, and a date field would widen every row.
      function datePicker(e) {
        const pop = `date-popover-${e.id}`
        return `<button type="button" data-ui="button" data-variant="ghost" data-size="icon" popovertarget="${pop}" data-entry="${e.id}" data-key="date"
            aria-label="Date: ${dayFmt.format(e.startedAt)}" title="Move to another day" class="size-8 text-muted-foreground sm:opacity-0 sm:transition-opacity sm:group-hover:opacity-100 sm:group-focus-within:opacity-100">${icon('calendar')}</button>
          <div id="${pop}" popover data-ui="popover" data-align="start" role="dialog" aria-label="Date" class="grid w-60 gap-2">
            <label data-ui="label" for="date-input-${e.id}">Date</label>
            <input id="date-input-${e.id}" data-ui="input" type="date" required data-date-entry="${e.id}" value="${toDateValue(e.startedAt)}" max="${toDateValue(Date.now())}"
              aria-describedby="date-error-${e.id}" />
            <p id="date-error-${e.id}" data-ui="error-message" role="alert" hidden></p>
            <p class="text-xs text-muted-foreground">Start and end times stay the same.</p>
          </div>`
      }

      function projectMenu(e) {
        const p = project(e.projectId)
        const menu = `project-menu-${e.id}`
        const items = projectChoices(e.projectId)
          .map(
            (c) =>
              `<button type="button" role="menuitemradio" data-ui="menu-radio-item" aria-checked="${c.id === e.projectId}" data-pick="${c.id}" data-pick-entry="${e.id}" class="gap-2">${dot(c)}<span class="min-w-0 truncate">${escapeHtml(c.name)}</span></button>`
          )
          .join('')
        return `<button type="button" data-ui="button" data-variant="ghost" data-size="sm" popovertarget="${menu}" aria-haspopup="menu" data-entry="${e.id}" data-key="project"
            aria-label="Project: ${escapeHtml(p.name)}" class="h-8 w-full justify-start gap-1.5 px-2 text-xs font-normal ${p.id === 'none' ? 'text-muted-foreground' : ''}">${dot(p)}<span class="min-w-0 truncate">${escapeHtml(p.name)}</span></button>
          <div id="${menu}" popover data-ui="menu" role="menu" data-align="start" aria-label="Project" class="max-h-80 w-64 overflow-y-auto">${items}</div>`
      }

      function rowErrorText(e) {
        const err = inline.errors[e.id]
        return `<p id="error-${e.id}" data-row-error="${e.id}" data-ui="error-message" role="alert" class="pt-1"${err ? '' : ' hidden'}>${err ? escapeHtml(err.message) : ''}</p>`
      }

      // One line from 768 px. Below it: description; project, ticket, and actions; date, times,
      // and duration.
      function cardRow(e, compact) {
        const ticketColumn = settings.wideTimer
        return `<li class="group px-4 ${compact ? 'py-2' : 'py-3'}" data-row="${e.id}">
          <div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-3 gap-y-1 md:flex">
            <div class="col-span-2 -ml-2 min-w-0 md:flex-1">${inlineDescription(e, ticketColumn ? '[&>*]:max-md:hidden [&>*]:xl:hidden' : '')}</div>
            <div class="-ml-2 flex min-w-0 items-center gap-2 md:contents">
              ${ticketColumn ? `<div class="order-last flex min-w-0 shrink-0 md:hidden xl:order-none xl:flex xl:w-32">${ticketCell(e)}</div>` : ''}
              <div class="min-w-0 md:w-36 md:shrink-0">${projectMenu(e)}</div>
            </div>
            <div class="row-start-3 -ml-2 flex shrink-0 items-center gap-1 text-muted-foreground md:ml-0">${datePicker(e)}${timeInput(e, 'start')}<span aria-hidden="true">–</span>${timeInput(e, 'end')}${nextDayMark(e)}</div>
            ${durationCell(e, 'row-start-3 w-16 shrink-0 text-right text-sm tabular-nums')}
            <div class="col-start-2 row-start-2 justify-self-end">${actions(e)}</div>
          </div>
          ${rowErrorText(e)}
        </li>`
      }

      function renderDayCards(groups, compact) {
        return groups
          .map(
            (g) => `<div data-ui="card" class="overflow-hidden">
              <header class="flex items-center justify-between border-b px-4 py-2.5 text-sm">
                <h2 class="font-medium">${dayLabel(g.day)}</h2>
                <span class="tabular-nums text-muted-foreground">${duration(g.total, false)}</span>
              </header>
              <ul class="divide-y">${g.items.map((e) => cardRow(e, compact)).join('')}</ul>
            </div>`
          )
          .join('')
      }

      function tableRow(e) {
        return `<tr data-ui="table-row" class="group" data-row="${e.id}">
            ${
              !settings.wideTimer
                ? `<td data-ui="table-cell" class="max-w-0"><div class="-ml-2">${inlineDescription(e)}</div></td>`
                : `<td data-ui="table-cell" class="max-w-0"><div class="-ml-2">${descriptionInput(e)}</div></td>
            <td data-ui="table-cell" class="max-w-0"><div class="flex">${ticketCell(e)}</div></td>`
            }
            <td data-ui="table-cell" class="max-w-0">${projectMenu(e)}</td>
            <td data-ui="table-cell"><div class="flex items-center gap-1">${datePicker(e)}${timeInput(e, 'start')}</div></td>
            <td data-ui="table-cell"><div class="flex items-center gap-1">${timeInput(e, 'end')}${nextDayMark(e)}</div></td>
            <td data-ui="table-cell" class="text-right tabular-nums">${durationCell(e, '')}</td>
            <td data-ui="table-cell">${actions(e)}</td>
          </tr>
          <tr data-ui="table-row" data-error-row="${e.id}" class="hover:bg-transparent"${inline.errors[e.id] ? '' : ' hidden'}><td data-ui="table-cell" colspan="${!settings.wideTimer ? 6 : 7}" class="pt-0">${rowErrorText(e)}</td></tr>`
      }

      function renderTable(groups) {
        const column = settings.wideTimer
        const rows = groups
          .map(
            (g) => `<tr data-ui="table-row" class="bg-muted/50">
                <th colspan="${column ? 5 : 4}" scope="rowgroup" data-ui="table-cell" class="text-left text-xs font-medium">${dayLabel(g.day)}</th>
                <td data-ui="table-cell" class="text-right text-xs tabular-nums">${duration(g.total, false)}</td>
                <td data-ui="table-cell"></td>
              </tr>
              ${g.items.map(tableRow).join('')}`
          )
          .join('')
        return `<div class="surface relative w-full overflow-auto rounded-lg border bg-card">
          <table data-ui="table" class="${column ? 'min-w-[52rem]' : 'min-w-[44rem]'} table-fixed">
            <colgroup><col />${column ? '<col class="w-32" />' : ''}<col class="w-40" /><col class="w-28" /><col class="w-28" /><col class="w-24" /><col class="w-24" /></colgroup>
            <thead data-ui="table-header">
              <tr data-ui="table-row"><th data-ui="table-head">Description</th>${column ? '<th data-ui="table-head">Ticket</th>' : ''}<th data-ui="table-head">Project</th><th data-ui="table-head">Start</th><th data-ui="table-head">End</th><th data-ui="table-head" class="text-right">Duration</th><th data-ui="table-head"><span class="sr-only">Actions</span></th></tr>
            </thead>
            <tbody data-ui="table-body">${rows}</tbody>
          </table>
        </div>`
      }

      // The app updates rows in place; the prototype re-renders the list, so it puts back focus,
      // the caret, and an open project menu.
      let rendering = false
      function renderEntries() {
        const active = document.activeElement
        const focus = active?.dataset?.entry && { entry: active.dataset.entry, key: active.dataset.key, caret: active.type === 'text' ? active.selectionStart : null }
        const openMenu = document.querySelector('#entries [popover]:popover-open')?.id
        const design = document.body.dataset.design
        const groups = groupByDay(state.entries)
        const el = document.getElementById('entries')
        rendering = true
        if (!groups.length) el.innerHTML = emptyState()
        else if (design === 'table') el.innerHTML = renderTable(groups)
        else if (design === 'focus') el.innerHTML = renderDayCards(groups.slice(0, 3), true)
        else el.innerHTML = renderDayCards(groups, false)
        rendering = false
        markPending()
        if (focus) {
          const target = el.querySelector(`[data-entry="${focus.entry}"][data-key="${focus.key}"]`)
          target?.focus({ preventScroll: true })
          if (focus.caret !== null && target?.type === 'text') target.setSelectionRange(focus.caret, focus.caret)
        }
        if (openMenu) document.getElementById(openMenu)?.showPopover()
        if (inline.flash) {
          const row = el.querySelector(`[data-row="${inline.flash}"]`)
          row?.classList.add('entry-flash')
          row?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
          inline.flash = null
        }
        renderRecent()
      }

      function renderRecent() {
        const seen = new Set()
        const recent = []
        for (const e of [...state.entries].sort((a, b) => b.startedAt - a.startedAt)) {
          const key = `${e.ticket}|${e.description}|${e.projectId}`
          if ((!e.description && !e.ticket) || seen.has(key)) continue
          seen.add(key)
          recent.push(e)
          if (recent.length === 5) break
        }
        document.getElementById('recent').innerHTML = recent.length
          ? recent
              .map(
                (e) =>
                  `<button data-ui="button" data-variant="outline" data-size="sm" class="max-w-full" data-continue="${e.id}">${icon('play', 'size-3')}${dot(project(e.projectId))}<span class="min-w-0 truncate">${escapeHtml(e.description)}</span>${ticketLabel(e.ticket)}</button>`
              )
              .join('')
          : '<p class="text-sm text-muted-foreground">Recent entries appear here.</p>'
      }

      function renderSummary() {
        const now = Date.now()
        const all = state.running ? [...state.entries, state.running] : state.entries
        const sum = (from) => all.filter((e) => e.startedAt >= from).reduce((s, e) => s + entryDuration(e), 0)
        const week = all.filter((e) => e.startedAt >= startOfWeek(now))
        const byProject = projects
          .map((p) => ({ p, total: week.filter((e) => e.projectId === p.id).reduce((s, e) => s + entryDuration(e), 0) }))
          .filter((x) => x.total > 0)
          .sort((a, b) => b.total - a.total)
        const weekTotal = byProject.reduce((s, x) => s + x.total, 0)
        document.getElementById('summary').innerHTML = `
          <dl class="grid grid-cols-2 gap-3">
            <div><dt class="text-xs text-muted-foreground">Today</dt><dd class="text-lg tabular-nums">${duration(sum(startOfDay(now)), false)}</dd></div>
            <div><dt class="text-xs text-muted-foreground">This week</dt><dd class="text-lg tabular-nums">${duration(weekTotal, false)}</dd></div>
          </dl>
          ${
            byProject.length
              ? `<ul class="flex flex-col gap-2.5">${byProject
                  .map(
                    ({ p, total }) => `<li class="flex flex-col gap-1 text-xs">
                      <div class="flex items-center justify-between gap-2"><span class="flex min-w-0 items-center gap-1.5">${dot(p)}<span class="truncate">${escapeHtml(p.name)}</span></span><span class="tabular-nums text-muted-foreground">${duration(total, false)}</span></div>
                      <div class="h-1.5 rounded-full bg-muted"><div class="h-full rounded-full" style="width:${(total / weekTotal) * 100}%;background:${p.id === 'none' ? 'var(--muted-foreground)' : p.color}"></div></div>
                    </li>`
                  )
                  .join('')}</ul>`
              : '<p class="text-sm text-muted-foreground">Nothing tracked this week.</p>'
          }`
      }

      function renderTimer() {
        const running = state.running
        const toggle = document.getElementById('toggle')
        document.getElementById('elapsed').disabled = !running
        toggle.dataset.variant = running ? 'destructive' : 'default'
        toggle.innerHTML = running ? `${icon('square')}Stop` : `${icon('play')}Start`
        tick()
      }

      function tick() {
        document.getElementById('elapsed').textContent = duration(state.running ? entryDuration(state.running) : 0)
        document.title = state.running ? `${duration(entryDuration(state.running))} · Timer and entries` : 'Timer and entries'
        if (settings.showSummary) renderSummary()
      }

      // The ticket in the timer's and the entry popover's description fields, and the keys
      // their saved text has (see detectTicket).
      const drafts = { timer: { ticket: null, known: new Set() }, editor: { ticket: null, known: new Set() } }
      const ticketInput = (owner) => document.getElementById(owner === 'timer' ? 'description' : 'edit-description')
      function setTicket(owner, ticket, description) {
        drafts[owner] = { ticket: ticket ?? null, known: new Set(keysIn(description)) }
        renderTicket(owner)
      }
      function renderTicket(owner) {
        const ticket = drafts[owner].ticket
        document.getElementById(owner === 'timer' ? 'description-ticket' : 'edit-description-ticket').innerHTML = ticket ? ticketChip(ticket, owner) : ''
        document.querySelectorAll(`[data-add-issue="${owner}"]`).forEach((button) => button.hidden = !!ticket)
      }
      function commitTicket(owner) {
        const input = ticketInput(owner)
        const r = detectTicket(input.value, drafts[owner].known, drafts[owner].ticket)
        input.value = r.description
        drafts[owner].ticket = r.ticket
        renderTicket(owner)
        return r
      }
      // Turns the chip back into text, after committing what was typed, and leaves the caret
      // after the key.
      function untickField(owner) {
        const input = ticketInput(owner)
        const key = commitTicket(owner).ticket
        if (!key) return
        const r = untick(key, input.value)
        input.value = r.description
        drafts[owner].ticket = null
        drafts[owner].known.add(key)
        renderTicket(owner)
        if (owner === 'timer' && state.running) updateEntry('running', { description: r.description, ticket: null })
        input.focus()
        const caret = r.description.startsWith(`${key} `) ? key.length + 1 : 0
        input.setSelectionRange(caret, caret)
      }
      // The running entry saves its description and ticket on Enter or blur, as the app's
      // timer does.
      function saveRunning() {
        const r = commitTicket('timer')
        const running = state.running
        if (running && (r.description !== running.description || r.ticket !== running.ticket)) {
          updateEntry('running', { description: r.description, ticket: r.ticket })
        }
      }

      function setInputs(description, projectId, ticket = null) {
        document.getElementById('description').value = description
        document.getElementById('project').value = projectId
        setTicket('timer', ticket, description)
      }
      const selectedProject = () => document.getElementById('project').value

      // Named mutations, mirroring the planned server functions.
      function startTimer(description, projectId, ticket = null) {
        if (state.running) stopTimer()
        state.running = { id: `e${nextId++}`, description, projectId, ticket, startedAt: Date.now() }
        setInputs(description, projectId, ticket)
        renderTimer()
        refuse(state.running.id, 'Start timer')
      }
      function stopTimer() {
        refuse(state.running.id, 'Stop timer')
        state.entries.push({ ...state.running, stoppedAt: Date.now() })
        state.running = null
        setInputs('', 'none')
        renderTimer()
        renderEntries()
      }
      function createEntry(values) {
        const id = `e${nextId++}`
        state.entries.push({ id, ...values })
        refuse(id, 'Add entry')
        inline.flash = id
        renderEntries()
        renderSummary()
      }
      function deleteEntry(id) {
        refuse(null, 'Delete entry')
        state.entries = state.entries.filter((e) => e.id !== id)
        clearDraft(id, 'description', 'start', 'end')
        delete inline.errors[id]
        renderEntries()
        renderSummary()
      }

      function loadFixture(name) {
        const f = fixtures[name]()
        state.entries = f.entries
        state.running = f.running
        inline.drafts = {}
        inline.errors = {}
        setInputs(f.running?.description ?? '', f.running?.projectId ?? 'none', f.running?.ticket)
        renderTimer()
        renderEntries()
        renderSummary()
      }

      // User settings (user_settings in the app), read and written through the app frame.
      let settings = appFrame.settings.get()

      function applySettings() {
        settings = appFrame.settings.get()
        document.body.dataset.design = settings.design
        document.body.dataset.width = settings.wideTimer ? 'wide' : 'standard'
        document.body.dataset.summary = settings.showSummary ? 'on' : 'off'
        document.querySelectorAll('[data-setting]').forEach((b) => {
          const pressed = settings[b.dataset.setting] === b.dataset.value
          b.setAttribute('aria-pressed', String(pressed))
          b.toggleAttribute('data-pressed', pressed)
        })
        ui.setSwitch(document.getElementById('summary-switch'), settings.showSummary)
        ui.setSwitch(document.getElementById('wide-switch'), settings.wideTimer)
        renderEntries()
        renderSummary()
      }

      // Entry editor, a popover under Add entry or the timer's clock. Times are entered in the
      // browser zone (the user's zone in the app).
      const editor = document.getElementById('entry-popover')
      const field = (id) => document.getElementById(`edit-${id}`)
      const pad = (n) => String(n).padStart(2, '0')
      const toDateValue = (t) => {
        const d = new Date(t)
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
      }
      const toTimeValue = (t) => {
        const d = new Date(t)
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`
      }
      const fromValues = (date, time, addDays = 0) => {
        const [y, m, d] = date.split('-').map(Number)
        const [h, min] = time.split(':').map(Number)
        return new Date(y, m - 1, d + addDays, h, min).getTime()
      }
      let editing = null
      // What was typed into Add entry, kept when the popover closes by Escape or a click outside;
      // Cancel and Save clear it.
      let newDraft = null
      // Like the app, errors show once saving was tried, then follow the input.
      let saveTried = false

      // A new entry starts where today's last one ended, so filling a gap needs only the end.
      function lastEndToday() {
        const ends = state.entries.map((e) => e.stoppedAt).filter((t) => t >= startOfDay(Date.now()))
        return ends.length ? toTimeValue(Math.max(...ends)) : ''
      }

      function openEditor(kind) {
        const e = kind === 'new' ? { description: '', projectId: 'none', ticket: null, startedAt: Date.now() } : state.running
        editing = kind
        document.getElementById('entry-popover-title').textContent = kind === 'new' ? 'Add entry' : 'Edit running entry'
        document.getElementById('entry-popover-description').textContent = `Times are in ${Intl.DateTimeFormat().resolvedOptions().timeZone}.`
        const values = (kind === 'new' && newDraft) || {
          description: e.description,
          project: e.projectId,
          date: toDateValue(e.startedAt),
          start: kind === 'new' ? lastEndToday() : toTimeValue(e.startedAt),
          end: '',
          ticket: e.ticket ?? null,
        }
        field('project').innerHTML = projectOptions(values.project)
        for (const [id, value] of Object.entries(values)) if (id !== 'ticket') field(id).value = value
        setTicket('editor', values.ticket, values.description)
        document.getElementById('edit-end-field').hidden = kind === 'running'
        saveTried = false
        showEditorState(readEditor(), false)
      }
      function closeEditor({ discard }) {
        if (discard && editing === 'new') newDraft = null
        editing = discard ? null : editing
        editor.hidePopover()
      }

      function readEditor() {
        const running = editing === 'running'
        const date = field('date').value
        const start = field('start').value
        const end = field('end').value
        if (!date || !start || (!running && !end)) return { error: running ? 'Enter a date and start time.' : 'Enter a date, start and end time.' }
        const startedAt = fromValues(date, start)
        const now = Date.now()
        if (running) {
          if (startedAt > now) return { error: "A running entry can't start in the future." }
          return { patch: { startedAt }, summary: `Running for ${duration(now - startedAt, false)}` }
        }
        const nextDay = fromValues(date, end) <= startedAt
        const stoppedAt = fromValues(date, end, nextDay ? 1 : 0)
        if (stoppedAt > now) return { error: "An entry can't end in the future." }
        return { patch: { startedAt, stoppedAt }, summary: `Duration ${duration(stoppedAt - startedAt, false)}${nextDay ? ' · ends the next day' : ''}` }
      }

      function showEditorState(result, showError = true) {
        const error = document.getElementById('edit-error')
        document.getElementById('edit-summary').textContent = result.summary ?? ''
        error.textContent = result.error ?? ''
        error.hidden = !(showError && result.error)
        for (const id of ['date', 'start', 'end']) field(id).toggleAttribute('data-invalid', !!(showError && result.error))
      }

      function updateEntry(id, patch) {
        refuse(id === 'running' ? state.running.id : id, 'Edit entry')
        if (id === 'running') {
          Object.assign(state.running, patch)
          setInputs(state.running.description, state.running.projectId, state.running.ticket)
          renderTimer()
        } else {
          Object.assign(find(id), patch)
          renderEntries()
        }
        renderSummary()
      }

      // Inline times, read like the editor's: the date is the start's, and an end at or before
      // the start means the next day. A value in the saved minute keeps the saved instant.
      function rowValues(e) {
        return { start: draft(e.id, 'start') ?? toTimeValue(e.startedAt), end: draft(e.id, 'end') ?? toTimeValue(e.stoppedAt) }
      }
      function readTimes(e, { start, end }, key = 'end') {
        if (!start) return { error: 'Enter a start time.', key: 'start' }
        if (!end) return { error: 'Enter an end time.', key: 'end' }
        const keep = (t, saved) => (Math.floor(t / MIN) === Math.floor(saved / MIN) ? saved : t)
        const date = toDateValue(e.startedAt)
        const startedAt = keep(fromValues(date, start), e.startedAt)
        const sameDay = fromValues(date, end)
        const stoppedAt = keep(sameDay <= startedAt ? fromValues(date, end, 1) : sameDay, e.stoppedAt)
        if (stoppedAt > Date.now()) return { error: "An entry can't end in the future.", key }
        return { startedAt, stoppedAt, nextDay: toDateValue(stoppedAt) !== date }
      }

      // Updates a row's duration, next-day mark, and validation while the user types, without a re-render.
      function refreshRow(id) {
        const e = find(id)
        if (!e) return
        const err = inline.errors[id]
        const r = readTimes(e, rowValues(e), err?.key)
        if (err?.kind === 'invalid') {
          if (r.error) inline.errors[id] = { kind: 'invalid', key: r.key, message: r.error }
          else delete inline.errors[id]
        }
        const now = inline.errors[id]
        const q = (sel) => document.querySelector(sel)
        if (!q(`[data-duration="${id}"]`)) return
        q(`[data-duration="${id}"]`).textContent = r.error ? '—' : duration(r.stoppedAt - r.startedAt)
        q(`[data-next-day="${id}"]`).textContent = !r.error && r.nextDay ? '+1' : ''
        for (const key of ['start', 'end']) {
          const input = q(`input[data-entry="${id}"][data-key="${key}"]`)
          const invalid = now?.kind === 'invalid' && now.key === key
          input.toggleAttribute('data-invalid', invalid)
          if (invalid) input.setAttribute('aria-invalid', 'true')
          else input.removeAttribute('aria-invalid')
        }
        const message = q(`[data-row-error="${id}"]`)
        message.textContent = now?.message ?? ''
        message.hidden = !now
        q(`[data-error-row="${id}"]`)?.toggleAttribute('hidden', !now)
      }

      // updateEntry with only the committed fields, applied at once. With "Fail saves" on, the
      // simulated server call fails and the fields roll back, with an error on the row.
      function saveField(id, patch, what, { render = true } = {}) {
        const e = find(id)
        const before = Object.fromEntries(Object.keys(patch).map((k) => [k, e[k]]))
        const fail = document.getElementById('fail-saves').checked
        if (refuse(id, `Edit ${what}`)) return finishSave(id, patch, render)
        if (inline.errors[id]?.kind === 'failed') delete inline.errors[id]
        Object.assign(e, patch)
        if (render) renderEntries()
        else refreshRow(id)
        renderRecent()
        renderSummary()
        setTimeout(() => {
          const current = find(id)
          if (!fail || !current) return
          for (const k of Object.keys(patch)) if (current[k] === patch[k]) current[k] = before[k]
          inline.errors[id] = { kind: 'failed', message: `Couldn't save the ${what}, so it's back to the saved value. Try again.` }
          renderEntries()
          renderSummary()
        }, 900)
      }

      function commitDescription(id) {
        const value = draft(id, 'description')
        if (value === undefined) return
        clearDraft(id, 'description')
        const e = find(id)
        const { description, ticket } = detectTicket(value, new Set(keysIn(e.description)), e.ticket)
        const patch = {}
        if (description !== e.description) patch.description = description
        if (ticket !== e.ticket) patch.ticket = ticket
        // A new chip needs the row drawn again; a text change doesn't.
        if (Object.keys(patch).length) saveField(id, patch, 'description', { render: 'ticket' in patch })
        const input = document.querySelector(`input[data-entry="${id}"][data-key="description"]`)
        if (input) input.value = description
        const mirror = document.querySelector(`[data-mirror="${id}"]`)
        if (mirror) mirror.textContent = description || 'No description'
      }

      function untickRow(id) {
        const e = find(id)
        const typed = detectTicket(draft(id, 'description') ?? e.description, new Set(keysIn(e.description)), e.ticket)
        const key = typed.ticket
        if (!key) return
        const r = untick(key, typed.description)
        clearDraft(id, 'description')
        saveField(id, { description: r.description, ticket: null }, 'ticket')
        const input = document.querySelector(`input[data-entry="${id}"][data-key="description"]`)
        input?.focus()
        const caret = r.description.startsWith(`${key} `) ? key.length + 1 : 0
        input?.setSelectionRange(caret, caret)
      }

      function commitTime(id, key) {
        const e = find(id)
        if (!e || (draft(id, 'start') === undefined && draft(id, 'end') === undefined)) return
        const r = readTimes(e, rowValues(e), key)
        if (r.error) {
          inline.errors[id] = { kind: 'invalid', key: r.key, message: r.error }
          refreshRow(id)
          return
        }
        clearDraft(id, 'start', 'end')
        if (inline.errors[id]?.kind === 'invalid') delete inline.errors[id]
        const patch = {}
        if (r.startedAt !== e.startedAt) patch.startedAt = r.startedAt
        if (r.stoppedAt !== e.stoppedAt) patch.stoppedAt = r.stoppedAt
        const keys = Object.keys(patch)
        if (!keys.length) return refreshRow(id)
        saveField(id, patch, keys.length === 2 ? 'times' : keys[0] === 'startedAt' ? 'start time' : 'end time')
      }

      function commit(id, key) {
        if (key === 'description') commitDescription(id)
        else commitTime(id, key)
      }

      // A blur commits after the click that caused it, so re-rendering can't swallow that click.
      let pointerDown = false
      const afterPointer = []
      document.addEventListener('pointerdown', () => (pointerDown = true), true)
      document.addEventListener(
        'pointerup',
        () => {
          pointerDown = false
          setTimeout(() => afterPointer.splice(0).forEach((fn) => fn()))
        },
        true
      )
      const later = (fn) => (pointerDown ? afterPointer.push(fn) : setTimeout(fn))

      const entriesEl = document.getElementById('entries')
      entriesEl.addEventListener('input', (event) => {
        const t = event.target
        if (!t.matches('input[data-entry]')) return
        inline.drafts[t.dataset.entry] = { ...inline.drafts[t.dataset.entry], [t.dataset.key]: t.value }
        if (t.dataset.key !== 'description') refreshRow(t.dataset.entry)
        const mirror = document.querySelector(`[data-mirror="${t.dataset.entry}"]`)
        if (mirror && t.dataset.key === 'description') mirror.textContent = t.value || 'No description'
      })
      entriesEl.addEventListener('focusout', (event) => {
        const t = event.target
        if (rendering || !t.matches('input[data-entry]')) return
        later(() => commit(t.dataset.entry, t.dataset.key))
      })
      entriesEl.addEventListener('keydown', (event) => {
        const t = event.target
        if (!t.matches('input[data-entry]')) return
        const { entry: id, key } = t.dataset
        if (event.key === 'Enter') {
          event.preventDefault()
          t.blur()
        } else if (event.key === 'Escape') {
          event.preventDefault()
          const e = find(id)
          clearDraft(id, key)
          t.value = key === 'description' ? e.description : toTimeValue(key === 'start' ? e.startedAt : e.stoppedAt)
          const mirror = key === 'description' && document.querySelector(`[data-mirror="${id}"]`)
          if (mirror) mirror.textContent = e.description || 'No description'
          if (key !== 'description') refreshRow(id)
        }
      })
      entriesEl.addEventListener('change', (event) => {
        const t = event.target
        if (!t.matches('select[data-entry]')) return
        saveField(t.dataset.entry, { projectId: t.value }, 'project')
      })

      // The date popover moves the entry to another day, keeping its times and duration. It
      // saves when it closes or on Enter; Escape or an invalid date leaves the entry as it was.
      function readDate(e, value) {
        if (!value) return { error: 'Enter a date.' }
        const d = new Date(e.startedAt)
        const [y, m, day] = value.split('-').map(Number)
        d.setFullYear(y, m - 1, day)
        const startedAt = d.getTime()
        const stoppedAt = startedAt + (e.stoppedAt - e.startedAt)
        if (stoppedAt > Date.now()) return { error: "An entry can't end in the future." }
        return { startedAt, stoppedAt }
      }
      function showDateError(input, error) {
        const message = document.getElementById(`date-error-${input.dataset.dateEntry}`)
        input.toggleAttribute('data-invalid', !!error)
        message.textContent = error ?? ''
        message.hidden = !error
      }
      function commitDate(input) {
        const e = find(input.dataset.dateEntry)
        if (!e || input.value === toDateValue(e.startedAt)) return
        const r = readDate(e, input.value)
        if (r.error) {
          input.value = toDateValue(e.startedAt)
          return showDateError(input, null)
        }
        inline.flash = e.id
        saveField(e.id, { startedAt: r.startedAt, stoppedAt: r.stoppedAt }, 'date')
      }
      let dateCancelled = false
      entriesEl.addEventListener('input', (event) => {
        const t = event.target
        if (t.matches('[data-date-entry]')) showDateError(t, readDate(find(t.dataset.dateEntry), t.value).error)
      })
      entriesEl.addEventListener('keydown', (event) => {
        const t = event.target
        if (!t.matches('[data-date-entry]')) return
        if (event.key !== 'Enter') return
        // Otherwise the Enter also reaches the trigger, which gets focus back, and reopens the popover.
        event.preventDefault()
        if (!readDate(find(t.dataset.dateEntry), t.value).error) t.closest('[popover]').hidePopover()
      })
      document.addEventListener(
        'keydown',
        (event) => {
          if (event.key === 'Escape' && document.querySelector('[id^="date-popover-"]:popover-open')) dateCancelled = true
        },
        true
      )
      entriesEl.addEventListener(
        'toggle',
        (event) => {
          const input = event.target.querySelector?.('[data-date-entry]')
          if (!input || rendering) return
          if (event.newState === 'open') return input.focus()
          if (dateCancelled) {
            input.value = toDateValue(find(input.dataset.dateEntry).startedAt)
            showDateError(input, null)
          } else commitDate(input)
          dateCancelled = false
        },
        true
      )

      document.getElementById('entry-form').addEventListener('input', () => showEditorState(readEditor(), saveTried))
      document.getElementById('entry-form').addEventListener('submit', (event) => {
        event.preventDefault()
        saveTried = true
        const result = readEditor()
        showEditorState(result)
        if (result.error) return
        const { description, ticket } = commitTicket('editor')
        const values = { ...result.patch, description, ticket, projectId: field('project').value }
        if (editing === 'new') createEntry(values)
        else updateEntry(editing, values)
        closeEditor({ discard: true })
      })
      editor.querySelector('[data-entry-cancel]').addEventListener('click', () => closeEditor({ discard: true }))
      // The clicked button says which form opens: it fires before the popover toggles.
      let opener = 'new'
      document.getElementById('elapsed').addEventListener('click', () => {
        opener = 'running'
        editor.dataset.align = 'start'
      })
      document.getElementById('add-entry').addEventListener('click', () => {
        opener = 'new'
        delete editor.dataset.align
      })
      editor.addEventListener('beforetoggle', (event) => {
        if (event.newState === 'open') return openEditor(opener)
        if (editing !== 'new') return
        newDraft = Object.fromEntries(['description', 'project', 'date', 'start', 'end'].map((id) => [id, field(id).value]))
        newDraft.ticket = drafts.editor.ticket
      })
      editor.addEventListener('toggle', (event) => {
        if (event.newState === 'open') field(editing === 'running' ? 'start' : 'description').focus()
      })

      // Recent work under a description field, as the app's DescriptionCombobox lists it: the newest
      // distinct ticket, description, and project sets whose ticket or description contains the
      // typed text, leaving out archived and unavailable projects and the set already in the fields.
      function suggestions(text, projectId, ticket) {
        const query = text.trim().toLowerCase()
        const seen = new Set()
        const found = []
        for (const e of [...state.entries].sort((a, b) => b.startedAt - a.startedAt)) {
          const p = project(e.projectId)
          const key = `${e.ticket}|${e.description}|${e.projectId}`
          if ((!e.description && !e.ticket) || p.archived || p.unavailable || seen.has(key)) continue
          seen.add(key)
          if (!`${e.ticket ?? ''} ${e.description}`.toLowerCase().includes(query)) continue
          if (e.description === text.trim() && e.projectId === projectId && (e.ticket ?? null) === ticket) continue
          found.push(e)
          if (found.length === 8) break
        }
        return found
      }
      function highlight(text, query) {
        const at = query ? text.toLowerCase().indexOf(query.toLowerCase()) : -1
        if (at < 0) return escapeHtml(text)
        const end = at + query.length
        return `${escapeHtml(text.slice(0, at))}<span class="font-semibold">${escapeHtml(text.slice(at, end))}</span>${escapeHtml(text.slice(end))}`
      }

      // Turns a description input into a combobox. The list opens on focus and typing; arrows
      // move through it, Enter or a click picks, and Escape closes only the list. Picking fills
      // in the description and project; typing never changes the project.
      const quietFocus = new WeakSet()
      function combobox(input, select, onPick, { anchor = input, ticket = () => null } = {}) {
        const list = document.createElement('div')
        list.id = `${input.id}-suggestions`
        list.popover = 'manual'
        list.dataset.ui = 'listbox'
        list.setAttribute('role', 'listbox')
        list.setAttribute('aria-label', 'Recent entries')
        input.after(list)
        input.setAttribute('role', 'combobox')
        input.setAttribute('aria-autocomplete', 'list')
        input.setAttribute('aria-controls', list.id)
        input.setAttribute('aria-expanded', 'false')
        let items = []
        let active = -1

        function setActive(index) {
          active = index
          list.querySelectorAll('[role="option"]').forEach((o, i) => o.setAttribute('aria-selected', String(i === index)))
          if (index < 0) input.removeAttribute('aria-activedescendant')
          else {
            input.setAttribute('aria-activedescendant', `${list.id}-${index}`)
            document.getElementById(`${list.id}-${index}`).scrollIntoView({ block: 'nearest' })
          }
        }
        function place() {
          const r = anchor.getBoundingClientRect()
          const w = Math.min(Math.max(r.width, 288), innerWidth - 16)
          const h = list.getBoundingClientRect().height
          list.style.inset = 'auto'
          list.style.width = `${w}px`
          list.style.left = `${Math.max(8, Math.min(r.left, innerWidth - w - 8))}px`
          const below = r.bottom + 4 + h <= innerHeight - 8 || r.top - 4 - h < 8
          list.style.top = `${below ? r.bottom + 4 : r.top - 4 - h}px`
        }
        function open() {
          items = suggestions(input.value, select.value, ticket())
          if (!items.length) return close()
          const query = input.value.trim()
          list.innerHTML = items
            .map((e, i) => {
              const p = project(e.projectId)
              return `<div id="${list.id}-${i}" role="option" data-ui="option" aria-selected="false" data-index="${i}" class="gap-2">
                ${dot(p)}<span class="min-w-0 flex-1 truncate">${highlight(e.description, query)}</span>${ticketLabel(e.ticket, query)}
                ${p.id === 'none' ? '' : `<span class="max-w-[40%] shrink-0 truncate text-xs text-muted-foreground">${escapeHtml(p.name)}</span>`}
              </div>`
            })
            .join('') + (ticket() ? '' : `<div class="mt-1 border-t pt-1"><button type="button" data-ui="button" data-variant="ghost" data-size="sm" data-add-issue="${input.id === 'description' ? 'timer' : 'editor'}" class="h-7 w-full justify-start px-2 text-xs text-muted-foreground">Add an issue without replacing the description</button></div>`)
          if (!list.matches(':popover-open')) list.showPopover()
          input.setAttribute('aria-expanded', 'true')
          setActive(-1)
          place()
        }
        function close() {
          if (list.matches(':popover-open')) list.hidePopover()
          input.setAttribute('aria-expanded', 'false')
          input.removeAttribute('aria-activedescendant')
          active = -1
        }
        function pick(index) {
          const e = items[index]
          input.value = e.description
          select.value = e.projectId
          close()
          onPick(e)
        }

        input.addEventListener('focus', () => {
          if (quietFocus.has(input)) quietFocus.delete(input)
          else open()
        })
        input.addEventListener('input', open)
        input.addEventListener('blur', close)
        input.addEventListener('keydown', (event) => {
          const shown = list.matches(':popover-open')
          if (event.key === 'ArrowDown' || event.key === 'ArrowUp') {
            event.preventDefault()
            if (!shown) return open()
            // Past either end, the highlight goes back to the input.
            const next = active + (event.key === 'ArrowDown' ? 1 : -1)
            setActive(next >= items.length ? -1 : next < -1 ? items.length - 1 : next)
          } else if (event.key === 'Enter' && shown && active >= 0) {
            event.preventDefault()
            pick(active)
          } else if (event.key === 'Escape' && shown) {
            // Keeps an open entry popover from closing too.
            event.preventDefault()
            event.stopPropagation()
            close()
          }
        })
        // Keeps focus in the input, so a click doesn't blur it and close the list first.
        list.addEventListener('mousedown', (event) => event.preventDefault())
        list.addEventListener('click', (event) => {
          const option = event.target.closest('[role="option"]')
          if (option) pick(Number(option.dataset.index))
        })
        list.addEventListener('mousemove', (event) => {
          const option = event.target.closest('[role="option"]')
          if (option && Number(option.dataset.index) !== active) setActive(Number(option.dataset.index))
        })
        addEventListener('resize', () => list.matches(':popover-open') && place())
        addEventListener('scroll', () => list.matches(':popover-open') && place(), true)
        return { close }
      }

      combobox(
        document.getElementById('description'),
        document.getElementById('project'),
        (e) => {
          setTicket('timer', e.ticket, e.description)
          if (state.running) updateEntry('running', { description: e.description, projectId: e.projectId, ticket: e.ticket ?? null })
        },
        { anchor: document.getElementById('description-field'), ticket: () => drafts.timer.ticket }
      )
      combobox(
        field('description'),
        field('project'),
        (e) => {
          setTicket('editor', e.ticket, e.description)
          showEditorState(readEditor(), saveTried)
        },
        { anchor: document.getElementById('edit-description-field'), ticket: () => drafts.editor.ticket }
      )

      // Clicking the field's padding or between chips puts the caret in the text.
      document.querySelectorAll('.ticket-field').forEach((f) =>
        f.addEventListener('click', (event) => {
          if (event.target === f) f.querySelector('input').focus()
        })
      )
      for (const owner of ['timer', 'editor']) {
        const input = ticketInput(owner)
        input.addEventListener('blur', () => (owner === 'timer' ? saveRunning() : commitTicket(owner)))
      }
      const issuePicker = document.getElementById('issue-picker')
      const issueKey = document.getElementById('issue-key')
      let issueOwner = 'timer'
      let issueTrigger = null
      function placeIssuePicker() {
        if (!issueTrigger || !issuePicker.matches(':popover-open')) return
        const r = issueTrigger.getBoundingClientRect()
        issuePicker.style.inset = 'auto'
        issuePicker.style.left = `${Math.max(8, Math.min(r.left, innerWidth - issuePicker.offsetWidth - 8))}px`
        issuePicker.style.top = `${Math.max(8, Math.min(r.bottom + 4, innerHeight - issuePicker.offsetHeight - 8))}px`
      }
      addEventListener('resize', placeIssuePicker)
      issuePicker.addEventListener('toggle', (event) => {
        if (event.newState !== 'closed') return
        if (issueOwner === 'timer' || issueOwner === 'editor') {
          const input = ticketInput(issueOwner)
          quietFocus.add(input)
          input.focus()
        } else issueTrigger?.focus()
      })
      function addIssue(key) {
        if (issueOwner === 'timer' || issueOwner === 'editor') {
          const input = ticketInput(issueOwner)
          setTicket(issueOwner, key, input.value)
          if (issueOwner === 'timer') saveRunning()
        } else {
          saveField(issueOwner, { ticket: key }, 'ticket')
        }
        issuePicker.hidePopover()
      }
      document.addEventListener('click', (event) => {
        const trigger = event.target.closest('[data-add-issue]')
        if (!trigger) return
        issueOwner = trigger.dataset.addIssue
        // The suggestions' Add issue closes with them, so the picker hangs from the field.
        issueTrigger = trigger.closest('[role="listbox"]') ? ticketInput(issueOwner).closest('.ticket-field') : trigger
        document.querySelectorAll('[role="listbox"]:popover-open').forEach((list) => list.hidePopover())
        issueKey.value = ''
        document.getElementById('issue-error').hidden = true
        const recent = [...new Set([...state.entries].sort((a, b) => b.startedAt - a.startedAt).map((e) => e.ticket).filter(Boolean))].slice(0, 6)
        document.getElementById('recent-issues').innerHTML = recent.length ? recent.map((key) => `<button type="button" data-ui="button" data-variant="ghost" data-size="sm" data-issue-key="${escapeHtml(key)}" class="justify-start">${escapeHtml(key)}</button>`).join('') : '<p class="py-2 text-xs text-muted-foreground">No issues in loaded entries. Enter one above.</p>'
        issuePicker.showPopover()
        requestAnimationFrame(placeIssuePicker)
        issueKey.focus()
      })
      document.getElementById('recent-issues').addEventListener('click', (event) => {
        const button = event.target.closest('[data-issue-key]')
        if (button) addIssue(button.dataset.issueKey)
      })
      document.getElementById('issue-cancel').addEventListener('click', () => issuePicker.hidePopover())
      document.getElementById('issue-form').addEventListener('submit', (event) => {
        event.preventDefault()
        const text = issueKey.value.trim().replace(ISSUE_LINK, (_, key) => key.toUpperCase()).toUpperCase()
        if (!new RegExp(`^${KEY}$`).test(text)) {
          document.getElementById('issue-error').hidden = false
          return
        }
        addIssue(text)
      })
      document.getElementById('issue-links').addEventListener('change', (event) => {
        issueLinks = event.currentTarget.value
        renderTicket('timer')
        renderTicket('editor')
        renderEntries()
      })

      document.getElementById('project').innerHTML = projectOptions('none')

      function start() {
        const { description, ticket } = commitTicket('timer')
        startTimer(description, selectedProject(), ticket)
      }
      document.getElementById('toggle').addEventListener('click', () => {
        if (state.running) stopTimer()
        else start()
      })
      document.getElementById('description').addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || event.defaultPrevented) return
        event.preventDefault()
        if (state.running) saveRunning()
        else start()
      })
      document.getElementById('project').addEventListener('change', (event) => {
        if (state.running) state.running.projectId = event.currentTarget.value // updateEntry
      })
      document.getElementById('fixture').addEventListener('change', (event) => loadFixture(event.currentTarget.value))
      document.addEventListener('click', (event) => {
        const cont = event.target.closest('[data-continue]')
        const del = event.target.closest('[data-delete]')
        const pick = event.target.closest('[data-pick]')
        const untickButton = event.target.closest('[data-untick]')
        if (untickButton) {
          const { owner } = untickButton.dataset
          if (owner === 'timer' || owner === 'editor') untickField(owner)
          else untickRow(owner)
        } else if (pick) {
          const id = pick.dataset.pickEntry
          if (find(id)?.projectId !== pick.dataset.pick) saveField(id, { projectId: pick.dataset.pick }, 'project')
        } else if (cont) {
          const e = find(cont.dataset.continue)
          if (e) startTimer(e.description, e.projectId, e.ticket)
        } else if (del) deleteEntry(del.dataset.delete)
      })
      document.querySelectorAll('[data-setting]').forEach((b) =>
        b.addEventListener('click', () => {
          appFrame.settings.set({ [b.dataset.setting]: b.dataset.value })
        })
      )
      document.getElementById('summary-switch').addEventListener('change', (event) => {
        appFrame.settings.set({ showSummary: event.currentTarget.getAttribute('aria-checked') === 'true' })
      })
      document.getElementById('wide-switch').addEventListener('change', (event) => {
        appFrame.settings.set({ wideTimer: event.currentTarget.getAttribute('aria-checked') === 'true' })
      })

      // Server busy: the simulated server refuses every write with 503. The change stays on
      // screen, pending, until "Try again" sends it while the server answers again. Nothing
      // retries on its own, and a write made meanwhile waits behind the pending ones.
      const pending = []
      let retrying = false
      const busy = () => document.getElementById('server-busy').checked
      function refuse(entryId, label) {
        if (!busy() && !pending.length) return false
        setTimeout(() => {
          pending.push({ key: nextId++, entryId, label })
          renderPending()
        }, pending.length ? 0 : 600)
        return true
      }
      function finishSave(id, patch, render) {
        Object.assign(find(id), patch)
        if (render) renderEntries()
        else refreshRow(id)
        renderRecent()
        renderSummary()
      }
      function retryPending(key) {
        if (retrying) return
        retrying = true
        renderPending()
        setTimeout(() => {
          retrying = false
          if (!busy()) {
            if (key === undefined) pending.length = 0
            else pending.splice(0, pending.findIndex((p) => p.key === key) + 1)
          }
          renderPending()
        }, 700)
      }
      function pendingAlert(text, key) {
        return `<div data-ui="alert" class="mt-6 -mb-2">${icon('clock')}<div data-ui="alert-description" class="flex flex-wrap items-center justify-between gap-x-3 gap-y-2">
            <span role="status">${escapeHtml(text)}</span>
            <button type="button" data-ui="button" data-variant="outline" data-size="sm" data-retry="${key ?? ''}"${retrying ? ' disabled' : ''}>Try again</button>
          </div></div>`
      }
      function renderPending() {
        const ui = document.getElementById('pending-ui').value
        document.body.dataset.pendingUi = ui
        const el = document.getElementById('pending')
        if (!pending.length) el.innerHTML = ''
        else if (ui === 'each')
          el.innerHTML = pending.map((p) => pendingAlert('Change pending. The server is busy; try again when you’re ready.', p.key)).join('')
        else el.innerHTML = pendingAlert('Not saved yet: the server is busy. Try again when you’re ready.')
        markPending()
      }
      function markPending() {
        const ids = new Set(pending.map((p) => p.entryId))
        document.querySelectorAll('[data-row]').forEach((row) => row.toggleAttribute('data-pending', ids.has(row.dataset.row)))
        document.getElementById('timer').toggleAttribute('data-pending', !!state.running && ids.has(state.running.id))
      }
      document.getElementById('pending').addEventListener('click', (event) => {
        const button = event.target.closest('[data-retry]')
        if (button) retryPending(button.dataset.retry ? Number(button.dataset.retry) : undefined)
      })
      document.getElementById('pending-ui').addEventListener('change', renderPending)

      appFrame.on('settings', applySettings)

      ui.ready.then(() => {
        applySettings()
        loadFixture('running')
        setInterval(tick, 1000)
      })
    </script>
  </body>
</html>
