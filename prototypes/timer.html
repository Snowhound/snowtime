<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Timer and entries</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="prototype-theme.js"></script>
    <script src="ui.js"></script>
    <script src="app-frame.js"></script>
    <style type="text/tailwindcss">
      /* Timer controls share one DOM across designs; only layout changes. */
      body[data-design='bar'] .timer {
        @apply flex flex-col gap-3 rounded-xl border bg-card p-3 shadow-sm sm:flex-row sm:items-center;
      }
      body[data-design='bar'] .timer-elapsed {
        @apply justify-start text-lg sm:w-28 sm:justify-end;
      }
      body[data-design='focus'] .timer {
        @apply grid grid-cols-1 gap-4 rounded-xl border bg-card p-6 shadow-sm sm:grid-cols-[minmax(0,1fr)_auto];
      }
      body[data-design='focus'] .timer-elapsed {
        @apply order-first h-auto justify-self-start text-5xl font-light tracking-tight sm:col-span-2 sm:text-6xl;
      }
      body[data-design='focus'] .timer-fields {
        @apply sm:col-start-1;
      }
      body[data-design='focus'] .timer-toggle {
        @apply h-12 sm:w-36;
      }
      body[data-design='table'] .timer {
        @apply flex flex-col gap-2 border-b pb-4 sm:flex-row sm:items-center;
      }
      body[data-design='table'] .timer-elapsed {
        @apply justify-start text-base sm:w-24 sm:justify-end;
      }
      body:not([data-design='focus']) .focus-only,
      body[data-summary='off'] #summary-panel {
        display: none;
      }
      body[data-summary='off'] main {
        @apply lg:grid-cols-[minmax(0,1fr)];
      }
      .entry-actions {
        @apply flex items-center gap-1 sm:opacity-0 sm:transition-opacity sm:group-hover:opacity-100 sm:group-focus-within:opacity-100;
      }
      /* Inline time fields are typed; the picker button only widens them. */
      .inline-time::-webkit-calendar-picker-indicator {
        display: none;
      }
      /* Marks a row that moved to another day or was just added. */
      @keyframes entry-flash {
        from {
          background-color: var(--accent);
        }
      }
      .entry-flash {
        animation: entry-flash 1.6s ease-out;
      }
    </style>
    <link rel="stylesheet" href="prototype.css" />
  </head>
  <body data-design="bar" class="bg-muted/40">
    <div id="prototype-controls">
      <label for="fixture" class="sr-only">Fixture</label>
      <select id="fixture" data-ui="select" class="h-9 w-40">
        <option value="running">Running</option>
        <option value="idle">Idle</option>
        <option value="long">Long content</option>
        <option value="empty">Empty</option>
      </select>
      <label class="flex items-center gap-2 text-sm" title="Prototype only: inline saves fail and roll back">
        <input id="fail-saves" type="checkbox" data-ui="checkbox" />Fail saves
      </label>
    </div>

    <div class="mx-auto flex max-w-6xl items-center justify-between gap-4 px-4 pt-6 sm:px-8">
      <h1 class="text-2xl font-semibold tracking-tight">Timer</h1>
      <div class="flex items-center gap-2">
        <button id="add-entry" type="button" data-ui="button" data-variant="outline" class="h-9">
          <svg class="prototype-icon" aria-hidden="true"><use href="#icon-plus" /></svg>Add entry
        </button>
        <button data-ui="button" data-variant="outline" data-size="icon" class="size-9" popovertarget="view-settings" aria-label="View settings">
          <svg class="prototype-icon" aria-hidden="true"><use href="#icon-settings" /></svg>
        </button>
      </div>
      <div id="view-settings" popover data-ui="popover" class="grid gap-4" role="dialog" aria-labelledby="view-settings-title">
        <h2 id="view-settings-title" class="font-medium leading-none">View</h2>
        <div class="grid gap-2">
          <span data-ui="label" id="layout-label">Layout</span>
          <div data-ui="toggle-group" class="justify-start" role="group" aria-labelledby="layout-label">
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="design" data-value="bar">Bar</button>
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="design" data-value="focus">Focus</button>
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="design" data-value="table">Table</button>
          </div>
        </div>
        <div class="grid gap-2">
          <span data-ui="label" id="theme-label">Theme</span>
          <div data-ui="toggle-group" class="justify-start" role="group" aria-labelledby="theme-label">
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="theme" data-value="light">Light</button>
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="theme" data-value="dark">Dark</button>
            <button data-ui="toggle" data-variant="outline" data-size="sm" data-setting="theme" data-value="system">System</button>
          </div>
        </div>
        <div class="flex items-center justify-between gap-4">
          <span data-ui="label" id="summary-label">Show summary</span>
          <button id="summary-switch" type="button" role="switch" aria-checked="true" aria-labelledby="summary-label" data-ui="switch">
            <span data-ui="switch-thumb"></span>
          </button>
        </div>
        <div data-ui="separator"></div>
        <a href="settings.html#preferences" data-frame-link="settings.html#preferences" data-ui="button" data-variant="link" data-size="sm" class="h-auto justify-start p-0">All settings</a>
      </div>
    </div>

    <main class="mx-auto grid max-w-6xl grid-cols-[minmax(0,1fr)] gap-6 px-4 pb-6 pt-4 sm:px-8 lg:grid-cols-[minmax(0,1fr)_auto]">
      <div class="flex min-w-0 flex-col gap-6">
        <section id="timer" class="timer" aria-label="Timer">
          <div class="timer-fields flex min-w-0 flex-1 flex-col gap-2 sm:flex-row sm:items-center">
            <label for="description" class="sr-only">What are you working on?</label>
            <input id="description" data-ui="input" class="min-w-0 flex-1" type="text" placeholder="What are you working on?" autocomplete="off" />
            <label for="project" class="sr-only">Project</label>
            <select id="project" data-ui="select" class="sm:w-48"></select>
          </div>
          <button id="elapsed" type="button" data-ui="button" data-variant="ghost" class="timer-elapsed px-2 font-mono tabular-nums" aria-label="Edit start time" disabled>0:00:00</button>
          <button id="toggle" data-ui="button" class="timer-toggle" type="button"></button>
        </section>

        <section class="focus-only" aria-labelledby="recent-heading">
          <h2 id="recent-heading" class="mb-2 text-sm font-medium text-muted-foreground">Continue recent</h2>
          <div id="recent" class="flex flex-wrap gap-2"></div>
        </section>

        <section id="entries" aria-label="Time entries" class="flex min-w-0 flex-col gap-4"></section>
      </div>

      <aside id="summary-panel" class="w-full lg:w-72" aria-labelledby="summary-heading">
        <div data-ui="card">
          <div data-ui="card-header"><h2 id="summary-heading" data-ui="card-title">Summary</h2></div>
          <div id="summary" data-ui="card-content" class="flex flex-col gap-4"></div>
        </div>
      </aside>
    </main>

    <dialog id="entry-dialog" data-ui="dialog" aria-labelledby="entry-dialog-title" aria-describedby="entry-dialog-description">
      <form id="entry-form" class="grid gap-4" novalidate>
        <div data-ui="dialog-header">
          <h2 id="entry-dialog-title" data-ui="dialog-title">Edit entry</h2>
          <p id="entry-dialog-description" data-ui="dialog-description"></p>
        </div>
        <div class="grid gap-4">
          <div class="grid gap-1.5">
            <label data-ui="label" for="edit-description">Description</label>
            <input id="edit-description" data-ui="input" type="text" autocomplete="off" placeholder="What did you work on?" />
          </div>
          <div class="grid gap-1.5">
            <label data-ui="label" for="edit-project">Project</label>
            <select id="edit-project" data-ui="select"></select>
          </div>
          <div class="grid grid-cols-[minmax(0,1fr)] gap-4 sm:grid-cols-3">
            <div class="grid gap-1.5">
              <label data-ui="label" for="edit-date">Date</label>
              <input id="edit-date" data-ui="input" type="date" required />
            </div>
            <div class="grid gap-1.5">
              <label data-ui="label" for="edit-start">Start</label>
              <input id="edit-start" data-ui="input" type="time" required />
            </div>
            <div class="grid gap-1.5" id="edit-end-field">
              <label data-ui="label" for="edit-end">End</label>
              <input id="edit-end" data-ui="input" type="time" required />
            </div>
          </div>
          <p id="edit-summary" class="text-sm text-muted-foreground" aria-live="polite"></p>
          <p id="edit-error" data-ui="error-message" role="alert" hidden></p>
        </div>
        <div data-ui="dialog-footer">
          <button type="button" data-ui="button" data-variant="outline" data-dialog-cancel>Cancel</button>
          <button type="submit" data-ui="button">Save</button>
        </div>
      </form>
      <button type="button" data-ui="dialog-close" data-dialog-cancel>
        <svg class="prototype-icon" aria-hidden="true"><use href="#icon-x" /></svg>
        <span class="sr-only">Close</span>
      </button>
    </dialog>

    <script>
      appFrame.mount({ page: 'timer', title: 'Timer and entries' })

      const DAY = 86_400_000
      const HOUR = 3_600_000
      const MIN = 60_000

      const projects = [
        { id: 'none', name: 'No project', color: 'transparent' },
        { id: 'p1', name: 'Snowtime', color: 'var(--series-1)' },
        { id: 'p2', name: 'Client portal', color: 'var(--series-3)' },
        { id: 'p3', name: 'Internal', color: 'var(--series-4)' },
        { id: 'p4', name: 'Nordic Logistics – warehouse management system migration', color: 'var(--series-8)' },
        { id: 'p5', name: 'Website 2025', color: 'var(--series-6)', archived: true },
      ]
      const activeProjects = projects.filter((p) => p.id !== 'none' && !p.archived)

      const state = { entries: [], running: null }
      let nextId = 1

      const startOfDay = (t) => {
        const d = new Date(t)
        d.setHours(0, 0, 0, 0)
        return d.getTime()
      }
      // Week starts Monday (user setting in the app).
      const startOfWeek = (t) => {
        const d = new Date(startOfDay(t))
        return d.getTime() - ((d.getDay() + 6) % 7) * DAY
      }

      function entry(dayOffset, startHour, minutes, description, projectId) {
        const start = startOfDay(Date.now()) - dayOffset * DAY + startHour * HOUR
        return { id: `e${nextId++}`, description, projectId, startedAt: start, stoppedAt: start + minutes * MIN }
      }

      const fixtures = {
        running() {
          return {
            entries: [
              entry(0, 8.5, 55, 'Standup and planning', 'p3'),
              entry(0, 9.5, 95, 'Timer schema and partial unique index', 'p1'),
              // Crosses midnight into today; grouped under its start day.
              entry(1, 23, 100, 'Deploy window for the reporting release', 'p1'),
              entry(1, 9, 30, 'Standup and planning', 'p3'),
              entry(1, 9.75, 180, 'Invoice export review', 'p2'),
              entry(1, 13.5, 70, '', 'none'),
              // Archived project: listed in the picker as "(archived)" so other edits keep it.
              entry(2, 14, 45, 'Landing page copy fixes', 'p5'),
              entry(3, 10, 240, 'Report time zone boundaries', 'p1'),
            ],
            running: { id: `e${nextId++}`, description: 'Prototype timer layouts', projectId: 'p1', startedAt: Date.now() - 25 * MIN - 12_000 },
          }
        },
        idle() {
          return { entries: fixtures.running().entries, running: null }
        },
        long() {
          const long =
            'Workshop with the logistics team about migrating legacy warehouse stock adjustments, including edge cases for partial deliveries'
          const entries = []
          for (let day = 0; day < 6; day++)
            for (let i = 0; i < 5; i++) entries.push(entry(day, 8 + i * 1.75, 40 + i * 13, i % 2 ? long : 'Code review', i % 2 ? 'p4' : 'p2'))
          // A project the user can no longer see (its teams changed).
          entries.push(entry(1, 18, 35, 'Estimate for the tender', 'p-hidden'))
          return { entries, running: { id: `e${nextId++}`, description: long, projectId: 'p4', startedAt: Date.now() - 9 * HOUR - 3 * MIN } }
        },
        empty() {
          return { entries: [], running: null }
        },
      }

      const { escapeHtml, icon } = appFrame
      const project = (id) =>
        projects.find((p) => p.id === id) ?? { id, name: 'Unavailable project', color: 'var(--muted-foreground)', unavailable: true }
      // "No project", the active projects, and the entry's archived or unavailable project, as ProjectSelect lists them.
      function projectChoices(currentId) {
        const current = project(currentId)
        const choices = [projects[0], ...activeProjects]
        if (current.archived) choices.push({ ...current, name: `${current.name} (archived)` })
        if (current.unavailable) choices.push(current)
        return choices
      }
      const projectOptions = (currentId) =>
        projectChoices(currentId)
          .map((p) => `<option value="${p.id}"${p.id === currentId ? ' selected' : ''}>${escapeHtml(p.name)}</option>`)
          .join('')
      const dot = (p) =>
        p.id === 'none' ? '' : `<span class="inline-block size-2 shrink-0 rounded-full" style="background:${p.color}"></span>`
      const timeFmt = new Intl.DateTimeFormat(undefined, { hour: '2-digit', minute: '2-digit' })
      const dayFmt = new Intl.DateTimeFormat(undefined, { weekday: 'short', day: 'numeric', month: 'short' })

      function duration(ms, seconds = true) {
        const total = Math.max(0, Math.floor(ms / 1000))
        const h = Math.floor(total / 3600)
        const m = String(Math.floor((total % 3600) / 60)).padStart(2, '0')
        const s = String(total % 60).padStart(2, '0')
        return seconds ? `${h}:${m}:${s}` : `${h}:${m}`
      }
      function dayLabel(t) {
        const diff = Math.round((startOfDay(Date.now()) - startOfDay(t)) / DAY)
        return diff === 0 ? 'Today' : diff === 1 ? 'Yesterday' : dayFmt.format(t)
      }
      const entryDuration = (e) => (e.stoppedAt ?? Date.now()) - e.startedAt
      const describe = (e) =>
        e.description ? escapeHtml(e.description) : '<span class="text-muted-foreground italic">No description</span>'
      const name = (e) => escapeHtml(e.description || 'entry')

      function groupByDay(entries) {
        const groups = new Map()
        for (const e of [...entries].sort((a, b) => b.startedAt - a.startedAt)) {
          const key = startOfDay(e.startedAt)
          if (!groups.has(key)) groups.set(key, [])
          groups.get(key).push(e)
        }
        return [...groups.entries()].map(([day, items]) => ({ day, items, total: items.reduce((s, e) => s + entryDuration(e), 0) }))
      }

      // data-entry and data-key let a re-render put focus back on the same control.
      function actions(e) {
        return `<div class="entry-actions">
          <button data-ui="button" data-variant="ghost" data-size="icon" data-continue="${e.id}" data-entry="${e.id}" data-key="continue" aria-label="Continue ${name(e)}">${icon('play')}</button>
          <button data-ui="button" data-variant="ghost" data-size="icon" data-delete="${e.id}" data-entry="${e.id}" data-key="delete" aria-label="Delete ${name(e)}">${icon('trash-2')}</button>
        </div>`
      }

      function emptyState() {
        return `<div class="flex flex-col items-center gap-2 rounded-xl border border-dashed bg-background px-6 py-12 text-center">
          ${icon('clock', 'size-6 text-muted-foreground')}
          <p class="font-medium">No time tracked yet</p>
          <p class="text-sm text-muted-foreground">Start the timer above. Entries appear here grouped by day.</p>
        </div>`
      }

      // Inline editing. Every field is a control that reads as text until hovered or focused; a
      // committed field saves on its own. Below 768 px the row's fields stack on three lines.
      const inline = {
        // Unsaved values per entry: description, start, end. Invalid times stay here until fixed or Escape.
        drafts: {},
        // Per entry: { kind: 'invalid', key, message } or { kind: 'failed', message }.
        errors: {},
        flash: null,
      }
      const QUIET = 'border-transparent shadow-none hover:border-input focus-visible:border-input'
      const find = (id) => state.entries.find((x) => x.id === id)
      const draft = (id, key) => inline.drafts[id]?.[key]
      function clearDraft(id, ...keys) {
        for (const key of keys) delete inline.drafts[id]?.[key]
        if (inline.drafts[id] && !Object.keys(inline.drafts[id]).length) delete inline.drafts[id]
      }

      function descriptionInput(e) {
        return `<input data-ui="input" type="text" autocomplete="off" data-entry="${e.id}" data-key="description" aria-label="Description" placeholder="No description"
          value="${escapeHtml(draft(e.id, 'description') ?? e.description)}" class="h-8 px-2 text-ellipsis ${QUIET}" />`
      }

      function timeInput(e, key) {
        const err = inline.errors[e.id]
        const invalid = err?.kind === 'invalid' && err.key === key
        const value = draft(e.id, key) ?? toTimeValue(key === 'start' ? e.startedAt : e.stoppedAt)
        return `<input data-ui="input" type="time" required data-entry="${e.id}" data-key="${key}" aria-label="${key === 'start' ? 'Start' : 'End'}" value="${value}"
          aria-describedby="error-${e.id}"${invalid ? ' data-invalid aria-invalid="true"' : ''} class="inline-time h-8 w-auto px-1.5 text-xs tabular-nums [field-sizing:content] ${QUIET}" />`
      }

      function nextDayMark(e) {
        const r = readTimes(e, rowValues(e))
        return `<span data-next-day="${e.id}" class="w-5 text-xs text-muted-foreground" title="Ends the next day">${!r.error && r.nextDay ? '+1' : ''}</span>`
      }

      function durationCell(e, cls) {
        const r = readTimes(e, rowValues(e))
        return `<span data-duration="${e.id}" class="${cls}">${r.error ? '—' : duration(r.stoppedAt - r.startedAt)}</span>`
      }

      // The date lives in a popover: moving an entry to another day is rare, and a date field would widen every row.
      function datePicker(e) {
        const pop = `date-popover-${e.id}`
        return `<button type="button" data-ui="button" data-variant="ghost" data-size="icon" popovertarget="${pop}" data-entry="${e.id}" data-key="date"
            aria-label="Date: ${dayFmt.format(e.startedAt)}" title="Move to another day" class="size-8 text-muted-foreground sm:opacity-0 sm:transition-opacity sm:group-hover:opacity-100 sm:group-focus-within:opacity-100">${icon('calendar')}</button>
          <div id="${pop}" popover data-ui="popover" data-align="start" role="dialog" aria-label="Date" class="grid w-60 gap-2">
            <label data-ui="label" for="date-input-${e.id}">Date</label>
            <input id="date-input-${e.id}" data-ui="input" type="date" required data-date-entry="${e.id}" value="${toDateValue(e.startedAt)}" max="${toDateValue(Date.now())}"
              aria-describedby="date-error-${e.id}" />
            <p id="date-error-${e.id}" data-ui="error-message" role="alert" hidden></p>
            <p class="text-xs text-muted-foreground">Start and end times stay the same.</p>
          </div>`
      }

      function projectMenu(e) {
        const p = project(e.projectId)
        const menu = `project-menu-${e.id}`
        const items = projectChoices(e.projectId)
          .map(
            (c) =>
              `<button type="button" role="menuitemradio" data-ui="menu-radio-item" aria-checked="${c.id === e.projectId}" data-pick="${c.id}" data-pick-entry="${e.id}" class="gap-2">${dot(c)}<span class="min-w-0 truncate">${escapeHtml(c.name)}</span></button>`
          )
          .join('')
        return `<button type="button" data-ui="button" data-variant="ghost" data-size="sm" popovertarget="${menu}" aria-haspopup="menu" data-entry="${e.id}" data-key="project"
            aria-label="Project: ${escapeHtml(p.name)}" class="h-8 w-full justify-start gap-1.5 px-2 text-xs font-normal ${p.id === 'none' ? 'text-muted-foreground' : ''}">${dot(p)}<span class="min-w-0 truncate">${escapeHtml(p.name)}</span></button>
          <div id="${menu}" popover data-ui="menu" role="menu" data-align="start" aria-label="Project" class="max-h-80 w-64 overflow-y-auto">${items}</div>`
      }

      function rowErrorText(e) {
        const err = inline.errors[e.id]
        return `<p id="error-${e.id}" data-row-error="${e.id}" data-ui="error-message" role="alert" class="pt-1"${err ? '' : ' hidden'}>${err ? escapeHtml(err.message) : ''}</p>`
      }

      // One line from 768 px. Below it: description; project and actions; date, times, and duration.
      function cardRow(e, compact) {
        return `<li class="group px-4 ${compact ? 'py-2' : 'py-3'}" data-row="${e.id}">
          <div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-3 gap-y-1 md:flex">
            <div class="col-span-2 -ml-2 min-w-0 md:flex-1">${descriptionInput(e)}</div>
            <div class="-ml-2 min-w-0 md:ml-0 md:w-36 md:shrink-0">${projectMenu(e)}</div>
            <div class="row-start-3 -ml-2 flex shrink-0 items-center gap-1 text-muted-foreground md:ml-0">${datePicker(e)}${timeInput(e, 'start')}<span aria-hidden="true">–</span>${timeInput(e, 'end')}${nextDayMark(e)}</div>
            ${durationCell(e, 'row-start-3 w-16 shrink-0 text-right font-mono text-sm tabular-nums')}
            <div class="col-start-2 row-start-2 justify-self-end">${actions(e)}</div>
          </div>
          ${rowErrorText(e)}
        </li>`
      }

      function renderDayCards(groups, compact) {
        return groups
          .map(
            (g) => `<div data-ui="card" class="overflow-hidden">
              <header class="flex items-center justify-between border-b px-4 py-2.5 text-sm">
                <h2 class="font-medium">${dayLabel(g.day)}</h2>
                <span class="font-mono tabular-nums text-muted-foreground">${duration(g.total, false)}</span>
              </header>
              <ul class="divide-y">${g.items.map((e) => cardRow(e, compact)).join('')}</ul>
            </div>`
          )
          .join('')
      }

      function tableRow(e) {
        return `<tr data-ui="table-row" class="group" data-row="${e.id}">
            <td data-ui="table-cell" class="max-w-0"><div class="-ml-2">${descriptionInput(e)}</div></td>
            <td data-ui="table-cell" class="max-w-0">${projectMenu(e)}</td>
            <td data-ui="table-cell"><div class="flex items-center gap-1">${datePicker(e)}${timeInput(e, 'start')}</div></td>
            <td data-ui="table-cell"><div class="flex items-center gap-1">${timeInput(e, 'end')}${nextDayMark(e)}</div></td>
            <td data-ui="table-cell" class="text-right font-mono tabular-nums">${durationCell(e, '')}</td>
            <td data-ui="table-cell">${actions(e)}</td>
          </tr>
          <tr data-ui="table-row" data-error-row="${e.id}" class="hover:bg-transparent"${inline.errors[e.id] ? '' : ' hidden'}><td data-ui="table-cell" colspan="6" class="pt-0">${rowErrorText(e)}</td></tr>`
      }

      function renderTable(groups) {
        const rows = groups
          .map(
            (g) => `<tr data-ui="table-row" class="bg-muted/50">
                <th colspan="4" scope="rowgroup" data-ui="table-cell" class="text-left text-xs font-medium">${dayLabel(g.day)}</th>
                <td data-ui="table-cell" class="text-right font-mono text-xs tabular-nums">${duration(g.total, false)}</td>
                <td data-ui="table-cell"></td>
              </tr>
              ${g.items.map(tableRow).join('')}`
          )
          .join('')
        return `<div class="relative w-full overflow-auto rounded-lg border bg-card">
          <table data-ui="table" class="min-w-[44rem] table-fixed">
            <colgroup><col /><col class="w-40" /><col class="w-28" /><col class="w-28" /><col class="w-24" /><col class="w-24" /></colgroup>
            <thead data-ui="table-header">
              <tr data-ui="table-row"><th data-ui="table-head">Description</th><th data-ui="table-head">Project</th><th data-ui="table-head">Start</th><th data-ui="table-head">End</th><th data-ui="table-head" class="text-right">Duration</th><th data-ui="table-head"><span class="sr-only">Actions</span></th></tr>
            </thead>
            <tbody data-ui="table-body">${rows}</tbody>
          </table>
        </div>`
      }

      // The app updates rows in place; the prototype re-renders the list, so it puts back focus,
      // the caret, and an open project menu.
      let rendering = false
      function renderEntries() {
        const active = document.activeElement
        const focus = active?.dataset?.entry && { entry: active.dataset.entry, key: active.dataset.key, caret: active.type === 'text' ? active.selectionStart : null }
        const openMenu = document.querySelector('#entries [popover]:popover-open')?.id
        const design = document.body.dataset.design
        const groups = groupByDay(state.entries)
        const el = document.getElementById('entries')
        rendering = true
        if (!groups.length) el.innerHTML = emptyState()
        else if (design === 'table') el.innerHTML = renderTable(groups)
        else if (design === 'focus') el.innerHTML = renderDayCards(groups.slice(0, 3), true)
        else el.innerHTML = renderDayCards(groups, false)
        rendering = false
        if (focus) {
          const target = el.querySelector(`[data-entry="${focus.entry}"][data-key="${focus.key}"]`)
          target?.focus({ preventScroll: true })
          if (focus.caret !== null && target?.type === 'text') target.setSelectionRange(focus.caret, focus.caret)
        }
        if (openMenu) document.getElementById(openMenu)?.showPopover()
        if (inline.flash) {
          const row = el.querySelector(`[data-row="${inline.flash}"]`)
          row?.classList.add('entry-flash')
          row?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
          inline.flash = null
        }
        renderRecent()
      }

      function renderRecent() {
        const seen = new Set()
        const recent = []
        for (const e of [...state.entries].sort((a, b) => b.startedAt - a.startedAt)) {
          const key = `${e.description}|${e.projectId}`
          if (!e.description || seen.has(key)) continue
          seen.add(key)
          recent.push(e)
          if (recent.length === 5) break
        }
        document.getElementById('recent').innerHTML = recent.length
          ? recent
              .map(
                (e) =>
                  `<button data-ui="button" data-variant="outline" data-size="sm" class="max-w-full" data-continue="${e.id}">${icon('play', 'size-3')}${dot(project(e.projectId))}<span class="min-w-0 truncate">${escapeHtml(e.description)}</span></button>`
              )
              .join('')
          : '<p class="text-sm text-muted-foreground">Recent entries appear here.</p>'
      }

      function renderSummary() {
        const now = Date.now()
        const all = state.running ? [...state.entries, state.running] : state.entries
        const sum = (from) => all.filter((e) => e.startedAt >= from).reduce((s, e) => s + entryDuration(e), 0)
        const week = all.filter((e) => e.startedAt >= startOfWeek(now))
        const byProject = projects
          .map((p) => ({ p, total: week.filter((e) => e.projectId === p.id).reduce((s, e) => s + entryDuration(e), 0) }))
          .filter((x) => x.total > 0)
          .sort((a, b) => b.total - a.total)
        const weekTotal = byProject.reduce((s, x) => s + x.total, 0)
        document.getElementById('summary').innerHTML = `
          <dl class="grid grid-cols-2 gap-3">
            <div><dt class="text-xs text-muted-foreground">Today</dt><dd class="font-mono text-lg tabular-nums">${duration(sum(startOfDay(now)), false)}</dd></div>
            <div><dt class="text-xs text-muted-foreground">This week</dt><dd class="font-mono text-lg tabular-nums">${duration(weekTotal, false)}</dd></div>
          </dl>
          ${
            byProject.length
              ? `<ul class="flex flex-col gap-2.5">${byProject
                  .map(
                    ({ p, total }) => `<li class="flex flex-col gap-1 text-xs">
                      <div class="flex items-center justify-between gap-2"><span class="flex min-w-0 items-center gap-1.5">${dot(p)}<span class="truncate">${escapeHtml(p.name)}</span></span><span class="font-mono tabular-nums text-muted-foreground">${duration(total, false)}</span></div>
                      <div class="h-1.5 rounded-full bg-muted"><div class="h-full rounded-full" style="width:${(total / weekTotal) * 100}%;background:${p.id === 'none' ? 'var(--muted-foreground)' : p.color}"></div></div>
                    </li>`
                  )
                  .join('')}</ul>`
              : '<p class="text-sm text-muted-foreground">Nothing tracked this week.</p>'
          }`
      }

      function renderTimer() {
        const running = state.running
        const toggle = document.getElementById('toggle')
        document.getElementById('elapsed').disabled = !running
        toggle.dataset.variant = running ? 'destructive' : 'default'
        toggle.innerHTML = running ? `${icon('square')}Stop` : `${icon('play')}Start`
        tick()
      }

      function tick() {
        document.getElementById('elapsed').textContent = duration(state.running ? entryDuration(state.running) : 0)
        document.title = state.running ? `${duration(entryDuration(state.running))} · Timer and entries` : 'Timer and entries'
        if (settings.showSummary) renderSummary()
      }

      function setInputs(description, projectId) {
        document.getElementById('description').value = description
        document.getElementById('project').value = projectId
      }
      const selectedProject = () => document.getElementById('project').value

      // Named mutations, mirroring the planned server functions.
      function startTimer(description, projectId) {
        if (state.running) stopTimer()
        state.running = { id: `e${nextId++}`, description, projectId, startedAt: Date.now() }
        setInputs(description, projectId)
        renderTimer()
      }
      function stopTimer() {
        state.entries.push({ ...state.running, stoppedAt: Date.now() })
        state.running = null
        setInputs('', 'none')
        renderTimer()
        renderEntries()
      }
      function createEntry(values) {
        const id = `e${nextId++}`
        state.entries.push({ id, ...values })
        inline.flash = id
        renderEntries()
        renderSummary()
      }
      function deleteEntry(id) {
        state.entries = state.entries.filter((e) => e.id !== id)
        clearDraft(id, 'description', 'start', 'end')
        delete inline.errors[id]
        renderEntries()
        renderSummary()
      }

      function loadFixture(name) {
        const f = fixtures[name]()
        state.entries = f.entries
        state.running = f.running
        inline.drafts = {}
        inline.errors = {}
        setInputs(f.running?.description ?? '', f.running?.projectId ?? 'none')
        renderTimer()
        renderEntries()
        renderSummary()
      }

      // User settings (user_settings in the app), read and written through the app frame.
      let settings = appFrame.settings.get()

      function applySettings() {
        settings = appFrame.settings.get()
        document.body.dataset.design = settings.design
        document.body.dataset.summary = settings.showSummary ? 'on' : 'off'
        document.querySelectorAll('[data-setting]').forEach((b) => {
          const pressed = settings[b.dataset.setting] === b.dataset.value
          b.setAttribute('aria-pressed', String(pressed))
          b.toggleAttribute('data-pressed', pressed)
        })
        ui.setSwitch(document.getElementById('summary-switch'), settings.showSummary)
        renderEntries()
        renderSummary()
      }

      // Entry editor. Times are entered in the browser zone (the user's zone in the app).
      const dialog = document.getElementById('entry-dialog')
      const field = (id) => document.getElementById(`edit-${id}`)
      const pad = (n) => String(n).padStart(2, '0')
      const toDateValue = (t) => {
        const d = new Date(t)
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
      }
      const toTimeValue = (t) => {
        const d = new Date(t)
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`
      }
      const fromValues = (date, time, addDays = 0) => {
        const [y, m, d] = date.split('-').map(Number)
        const [h, min] = time.split(':').map(Number)
        return new Date(y, m - 1, d + addDays, h, min).getTime()
      }
      let editing = null

      function openEditor(id) {
        const kind = id
        const e = kind === 'new' ? { description: '', projectId: 'none', startedAt: Date.now() } : state.running
        if (!e) return
        editing = id
        document.getElementById('entry-dialog-title').textContent = kind === 'new' ? 'Add entry' : 'Edit running entry'
        document.getElementById('entry-dialog-description').textContent = `Times are in ${Intl.DateTimeFormat().resolvedOptions().timeZone}.`
        field('description').value = e.description
        field('project').innerHTML = projectOptions(e.projectId)
        field('project').value = e.projectId
        field('date').value = toDateValue(e.startedAt)
        field('start').value = kind === 'new' ? '' : toTimeValue(e.startedAt)
        field('end').value = ''
        document.getElementById('edit-end-field').hidden = kind === 'running'
        showEditorState(readEditor(), false)
        dialog.showModal()
      }

      function readEditor() {
        const running = editing === 'running'
        const date = field('date').value
        const start = field('start').value
        const end = field('end').value
        if (!date || !start || (!running && !end)) return { error: running ? 'Enter a date and start time.' : 'Enter a date, start and end time.' }
        const startedAt = fromValues(date, start)
        const now = Date.now()
        if (running) {
          if (startedAt > now) return { error: "A running entry can't start in the future." }
          return { patch: { startedAt }, summary: `Running for ${duration(now - startedAt, false)}` }
        }
        const nextDay = fromValues(date, end) <= startedAt
        const stoppedAt = fromValues(date, end, nextDay ? 1 : 0)
        if (stoppedAt > now) return { error: "An entry can't end in the future." }
        return { patch: { startedAt, stoppedAt }, summary: `Duration ${duration(stoppedAt - startedAt, false)}${nextDay ? ' · ends the next day' : ''}` }
      }

      function showEditorState(result, showError = true) {
        const error = document.getElementById('edit-error')
        document.getElementById('edit-summary').textContent = result.summary ?? ''
        error.textContent = result.error ?? ''
        error.hidden = !(showError && result.error)
        for (const id of ['date', 'start', 'end']) field(id).toggleAttribute('data-invalid', !!(showError && result.error))
      }

      function updateEntry(id, patch) {
        if (id === 'running') {
          Object.assign(state.running, patch)
          setInputs(state.running.description, state.running.projectId)
          renderTimer()
        } else {
          Object.assign(find(id), patch)
          renderEntries()
        }
        renderSummary()
      }

      // Inline times, read like the dialog's: the date is the start's, and an end at or before
      // the start means the next day. A value in the saved minute keeps the saved instant.
      function rowValues(e) {
        return { start: draft(e.id, 'start') ?? toTimeValue(e.startedAt), end: draft(e.id, 'end') ?? toTimeValue(e.stoppedAt) }
      }
      function readTimes(e, { start, end }, key = 'end') {
        if (!start) return { error: 'Enter a start time.', key: 'start' }
        if (!end) return { error: 'Enter an end time.', key: 'end' }
        const keep = (t, saved) => (Math.floor(t / MIN) === Math.floor(saved / MIN) ? saved : t)
        const date = toDateValue(e.startedAt)
        const startedAt = keep(fromValues(date, start), e.startedAt)
        const sameDay = fromValues(date, end)
        const stoppedAt = keep(sameDay <= startedAt ? fromValues(date, end, 1) : sameDay, e.stoppedAt)
        if (stoppedAt > Date.now()) return { error: "An entry can't end in the future.", key }
        return { startedAt, stoppedAt, nextDay: toDateValue(stoppedAt) !== date }
      }

      // Updates a row's duration, next-day mark, and validation while the user types, without a re-render.
      function refreshRow(id) {
        const e = find(id)
        if (!e) return
        const err = inline.errors[id]
        const r = readTimes(e, rowValues(e), err?.key)
        if (err?.kind === 'invalid') {
          if (r.error) inline.errors[id] = { kind: 'invalid', key: r.key, message: r.error }
          else delete inline.errors[id]
        }
        const now = inline.errors[id]
        const q = (sel) => document.querySelector(sel)
        if (!q(`[data-duration="${id}"]`)) return
        q(`[data-duration="${id}"]`).textContent = r.error ? '—' : duration(r.stoppedAt - r.startedAt)
        q(`[data-next-day="${id}"]`).textContent = !r.error && r.nextDay ? '+1' : ''
        for (const key of ['start', 'end']) {
          const input = q(`input[data-entry="${id}"][data-key="${key}"]`)
          const invalid = now?.kind === 'invalid' && now.key === key
          input.toggleAttribute('data-invalid', invalid)
          if (invalid) input.setAttribute('aria-invalid', 'true')
          else input.removeAttribute('aria-invalid')
        }
        const message = q(`[data-row-error="${id}"]`)
        message.textContent = now?.message ?? ''
        message.hidden = !now
        q(`[data-error-row="${id}"]`)?.toggleAttribute('hidden', !now)
      }

      // updateEntry with only the committed fields, applied at once. With "Fail saves" on, the
      // simulated server call fails and the fields roll back, with an error on the row.
      function saveField(id, patch, what, { render = true } = {}) {
        const e = find(id)
        const before = Object.fromEntries(Object.keys(patch).map((k) => [k, e[k]]))
        const fail = document.getElementById('fail-saves').checked
        if (inline.errors[id]?.kind === 'failed') delete inline.errors[id]
        Object.assign(e, patch)
        if (render) renderEntries()
        else refreshRow(id)
        renderRecent()
        renderSummary()
        setTimeout(() => {
          const current = find(id)
          if (!fail || !current) return
          for (const k of Object.keys(patch)) if (current[k] === patch[k]) current[k] = before[k]
          inline.errors[id] = { kind: 'failed', message: `Couldn't save the ${what}, so it's back to the saved value. Try again.` }
          renderEntries()
          renderSummary()
        }, 900)
      }

      function commitDescription(id) {
        const value = draft(id, 'description')
        if (value === undefined) return
        clearDraft(id, 'description')
        const e = find(id)
        const description = value.trim()
        if (description !== e.description) saveField(id, { description }, 'description', { render: false })
        const input = document.querySelector(`input[data-entry="${id}"][data-key="description"]`)
        if (input) input.value = description
      }

      function commitTime(id, key) {
        const e = find(id)
        if (!e || (draft(id, 'start') === undefined && draft(id, 'end') === undefined)) return
        const r = readTimes(e, rowValues(e), key)
        if (r.error) {
          inline.errors[id] = { kind: 'invalid', key: r.key, message: r.error }
          refreshRow(id)
          return
        }
        clearDraft(id, 'start', 'end')
        if (inline.errors[id]?.kind === 'invalid') delete inline.errors[id]
        const patch = {}
        if (r.startedAt !== e.startedAt) patch.startedAt = r.startedAt
        if (r.stoppedAt !== e.stoppedAt) patch.stoppedAt = r.stoppedAt
        const keys = Object.keys(patch)
        if (!keys.length) return refreshRow(id)
        saveField(id, patch, keys.length === 2 ? 'times' : keys[0] === 'startedAt' ? 'start time' : 'end time')
      }

      function commit(id, key) {
        if (key === 'description') commitDescription(id)
        else commitTime(id, key)
      }

      // A blur commits after the click that caused it, so re-rendering can't swallow that click.
      let pointerDown = false
      const afterPointer = []
      document.addEventListener('pointerdown', () => (pointerDown = true), true)
      document.addEventListener(
        'pointerup',
        () => {
          pointerDown = false
          setTimeout(() => afterPointer.splice(0).forEach((fn) => fn()))
        },
        true
      )
      const later = (fn) => (pointerDown ? afterPointer.push(fn) : setTimeout(fn))

      const entriesEl = document.getElementById('entries')
      entriesEl.addEventListener('input', (event) => {
        const t = event.target
        if (!t.matches('input[data-entry]')) return
        inline.drafts[t.dataset.entry] = { ...inline.drafts[t.dataset.entry], [t.dataset.key]: t.value }
        if (t.dataset.key !== 'description') refreshRow(t.dataset.entry)
      })
      entriesEl.addEventListener('focusout', (event) => {
        const t = event.target
        if (rendering || !t.matches('input[data-entry]')) return
        later(() => commit(t.dataset.entry, t.dataset.key))
      })
      entriesEl.addEventListener('keydown', (event) => {
        const t = event.target
        if (!t.matches('input[data-entry]')) return
        const { entry: id, key } = t.dataset
        if (event.key === 'Enter') {
          event.preventDefault()
          commit(id, key)
        } else if (event.key === 'Escape') {
          event.preventDefault()
          const e = find(id)
          clearDraft(id, key)
          t.value = key === 'description' ? e.description : toTimeValue(key === 'start' ? e.startedAt : e.stoppedAt)
          if (key !== 'description') refreshRow(id)
        }
      })
      entriesEl.addEventListener('change', (event) => {
        const t = event.target
        if (!t.matches('select[data-entry]')) return
        saveField(t.dataset.entry, { projectId: t.value }, 'project')
      })

      // The date popover moves the entry to another day, keeping its times and duration. It
      // saves when it closes or on Enter; Escape or an invalid date leaves the entry as it was.
      function readDate(e, value) {
        if (!value) return { error: 'Enter a date.' }
        const d = new Date(e.startedAt)
        const [y, m, day] = value.split('-').map(Number)
        d.setFullYear(y, m - 1, day)
        const startedAt = d.getTime()
        const stoppedAt = startedAt + (e.stoppedAt - e.startedAt)
        if (stoppedAt > Date.now()) return { error: "An entry can't end in the future." }
        return { startedAt, stoppedAt }
      }
      function showDateError(input, error) {
        const message = document.getElementById(`date-error-${input.dataset.dateEntry}`)
        input.toggleAttribute('data-invalid', !!error)
        message.textContent = error ?? ''
        message.hidden = !error
      }
      function commitDate(input) {
        const e = find(input.dataset.dateEntry)
        if (!e || input.value === toDateValue(e.startedAt)) return
        const r = readDate(e, input.value)
        if (r.error) {
          input.value = toDateValue(e.startedAt)
          return showDateError(input, null)
        }
        inline.flash = e.id
        saveField(e.id, { startedAt: r.startedAt, stoppedAt: r.stoppedAt }, 'date')
      }
      let dateCancelled = false
      entriesEl.addEventListener('input', (event) => {
        const t = event.target
        if (t.matches('[data-date-entry]')) showDateError(t, readDate(find(t.dataset.dateEntry), t.value).error)
      })
      entriesEl.addEventListener('keydown', (event) => {
        const t = event.target
        if (!t.matches('[data-date-entry]')) return
        if (event.key !== 'Enter') return
        // Otherwise the Enter also reaches the trigger, which gets focus back, and reopens the popover.
        event.preventDefault()
        if (!readDate(find(t.dataset.dateEntry), t.value).error) t.closest('[popover]').hidePopover()
      })
      document.addEventListener(
        'keydown',
        (event) => {
          if (event.key === 'Escape' && document.querySelector('[id^="date-popover-"]:popover-open')) dateCancelled = true
        },
        true
      )
      entriesEl.addEventListener(
        'toggle',
        (event) => {
          const input = event.target.querySelector?.('[data-date-entry]')
          if (!input || rendering) return
          if (event.newState === 'open') return input.focus()
          if (dateCancelled) {
            input.value = toDateValue(find(input.dataset.dateEntry).startedAt)
            showDateError(input, null)
          } else commitDate(input)
          dateCancelled = false
        },
        true
      )

      document.getElementById('entry-form').addEventListener('input', () => showEditorState(readEditor()))
      document.getElementById('entry-form').addEventListener('submit', (event) => {
        event.preventDefault()
        const result = readEditor()
        showEditorState(result)
        if (result.error) return
        const values = { ...result.patch, description: field('description').value.trim(), projectId: field('project').value }
        if (editing === 'new') createEntry(values)
        else updateEntry(editing, values)
        dialog.close()
      })
      dialog.querySelectorAll('[data-dialog-cancel]').forEach((b) => b.addEventListener('click', () => dialog.close()))
      dialog.addEventListener('click', (event) => {
        if (event.target !== dialog) return
        const r = dialog.getBoundingClientRect()
        const inside = event.clientX >= r.left && event.clientX <= r.right && event.clientY >= r.top && event.clientY <= r.bottom
        if (!inside) dialog.close()
      })
      document.getElementById('elapsed').addEventListener('click', () => openEditor('running'))
      document.getElementById('add-entry').addEventListener('click', () => openEditor('new'))

      document.getElementById('project').innerHTML = projectOptions('none')

      document.getElementById('toggle').addEventListener('click', () => {
        if (state.running) stopTimer()
        else startTimer(document.getElementById('description').value.trim(), selectedProject())
      })
      document.getElementById('description').addEventListener('keydown', (event) => {
        if (event.key === 'Enter' && !state.running) startTimer(event.currentTarget.value.trim(), selectedProject())
      })
      document.getElementById('description').addEventListener('input', (event) => {
        if (state.running) state.running.description = event.currentTarget.value // updateEntry
      })
      document.getElementById('project').addEventListener('change', (event) => {
        if (state.running) state.running.projectId = event.currentTarget.value // updateEntry
      })
      document.getElementById('fixture').addEventListener('change', (event) => loadFixture(event.currentTarget.value))
      document.addEventListener('click', (event) => {
        const cont = event.target.closest('[data-continue]')
        const del = event.target.closest('[data-delete]')
        const pick = event.target.closest('[data-pick]')
        if (pick) {
          const id = pick.dataset.pickEntry
          if (find(id)?.projectId !== pick.dataset.pick) saveField(id, { projectId: pick.dataset.pick }, 'project')
        } else if (cont) {
          const e = find(cont.dataset.continue)
          if (e) startTimer(e.description, e.projectId)
        } else if (del) deleteEntry(del.dataset.delete)
      })
      document.querySelectorAll('[data-setting]').forEach((b) =>
        b.addEventListener('click', () => {
          appFrame.settings.set({ [b.dataset.setting]: b.dataset.value })
        })
      )
      document.getElementById('summary-switch').addEventListener('change', (event) => {
        appFrame.settings.set({ showSummary: event.currentTarget.getAttribute('aria-checked') === 'true' })
      })
      appFrame.on('settings', applySettings)

      ui.ready.then(() => {
        applySettings()
        loadFixture('running')
        setInterval(tick, 1000)
      })
    </script>
  </body>
</html>
