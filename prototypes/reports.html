<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Reports</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3"></script>
    <script src="prototype-theme.js"></script>
    <script src="ui.js"></script>
    <script src="app-icon.js"></script>
    <script src="seasons.js"></script>
    <script src="scene.js"></script>
    <script src="intro.js"></script>
    <script src="app-frame.js"></script>
    <script src="app-data.js"></script>
    <style type="text/tailwindcss">
      .chart-grid {
        stroke: var(--border);
        stroke-width: 1;
      }
      .chart-band:focus-visible {
        outline: none;
      }
      .chart-band:focus-visible .chart-hit {
        @apply fill-muted;
      }
      .chart-band:hover .chart-hit {
        @apply fill-muted/60;
      }
      .chart-band[aria-pressed='true'] .chart-hit {
        @apply fill-primary/15;
      }
      .timesheet th:first-child,
      .timesheet td:first-child {
        @apply sticky left-0 z-10 bg-card;
      }
      /* On glass, the sticky column is see-through like the card until the table scrolls sideways;
         then it's solid, so the cells that scroll under it don't show. */
      body[data-scene-bg='on'][data-surfaces='glass'] .timesheet:not([data-scrolled]) :is(th, td):first-child {
        background-color: transparent;
      }
      /* Timesheet names and totals that narrow the Entries card. */
      .ts-pick {
        @apply -mx-1.5 -my-0.5 rounded-sm px-1.5 py-0.5 hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring;
      }
      .ts-pick[aria-pressed='true'] {
        @apply bg-primary text-primary-foreground hover:bg-primary/90 hover:text-primary-foreground;
      }
    </style>
    <link rel="stylesheet" href="prototype.css" />
  </head>
  <body class="bg-muted/40">
    <div id="prototype-controls">
      <label for="fixture" class="sr-only">Fixture</label>
      <select id="fixture" data-ui="select" class="h-9 w-36">
        <option value="populated">Populated</option>
        <option value="empty">Empty</option>
        <option value="long">Long content</option>
      </select>
    </div>

    <div class="mx-auto flex max-w-6xl flex-col gap-1 px-4 pt-6 sm:px-8">
      <h1 class="text-2xl font-semibold tracking-tight">Reports</h1>
      <p id="scope-note" class="scene-text text-sm text-muted-foreground"></p>
    </div>

    <main class="mx-auto flex max-w-6xl flex-col gap-6 px-4 pb-10 pt-4 sm:px-8">
      <!-- Filters: one row above the report, sized to fit 68rem, so Group by is a select. -->
      <section aria-label="Report filters" class="flex flex-col gap-3 lg:flex-row lg:flex-wrap lg:items-end">
        <div class="flex flex-wrap items-end gap-2">
          <div class="grid gap-1.5">
            <label data-ui="label" for="range-preset">Range</label>
            <select id="range-preset" data-ui="select" class="h-9 w-36">
              <option value="today">Today</option>
              <option value="this-week">This week</option>
              <option value="last-week">Last week</option>
              <option value="this-month">This month</option>
              <option value="last-month">Last month</option>
              <option value="custom">Custom</option>
            </select>
          </div>
          <div class="flex items-center gap-1">
            <button type="button" id="range-prev" data-ui="button" data-variant="outline" data-size="icon" class="size-9" aria-label="Previous range"></button>
            <button type="button" id="range-next" data-ui="button" data-variant="outline" data-size="icon" class="size-9" aria-label="Next range"></button>
          </div>
          <div class="flex items-end gap-2">
            <div class="grid gap-1.5">
              <label data-ui="label" for="range-from">From</label>
              <input id="range-from" data-ui="input" type="date" class="h-9 w-32 px-2" />
            </div>
            <div class="grid gap-1.5">
              <label data-ui="label" for="range-to">To</label>
              <input id="range-to" data-ui="input" type="date" class="h-9 w-32 px-2" />
            </div>
          </div>
        </div>
        <div class="flex flex-wrap items-end gap-2 lg:ml-auto">
          <div class="grid gap-1.5" id="scope-field">
            <label data-ui="label" for="scope">People</label>
            <select id="scope" data-ui="select" class="h-9 w-40"></select>
          </div>
          <div class="grid gap-1.5">
            <label data-ui="label" for="project">Project</label>
            <select id="project" data-ui="select" class="h-9 w-32"></select>
          </div>
          <div class="grid gap-1.5" id="group-select-field">
            <label data-ui="label" for="group-select">Group by</label>
            <select id="group-select" data-ui="select" class="h-9 w-32">
              <option value="project">Project</option>
              <option value="ticket">Ticket</option>
              <option value="team">Team</option>
              <option value="member">Member</option>
            </select>
          </div>
          <div class="grid gap-1.5">
            <span data-ui="label" id="unit-label">Totals per</span>
            <div data-ui="toggle-group" role="group" aria-labelledby="unit-label" class="justify-start">
              <button type="button" data-ui="toggle" data-variant="outline" data-unit="day">Day</button>
              <button type="button" data-ui="toggle" data-variant="outline" data-unit="week">Week</button>
            </div>
          </div>
        </div>
      </section>

      <p id="split-note" class="scene-text -mt-2 flex items-start gap-2 text-sm text-muted-foreground" hidden></p>

      <!-- Views of one report, as tabs; the filters and the Entries card below apply to all three.
           Export always gives the timesheet and its entries. -->
      <div class="-mb-2 flex flex-wrap items-center justify-between gap-2">
        <div data-ui="tabs-list" id="view-tabs" role="tablist" aria-label="Report view" class="h-9">
          <button type="button" role="tab" data-ui="tabs-trigger" id="tab-timesheet" data-view="timesheet" aria-controls="panel-timesheet" aria-selected="true">Timesheet</button>
          <button type="button" role="tab" data-ui="tabs-trigger" id="tab-summary" data-view="summary" aria-controls="panel-summary">Summary</button>
          <button type="button" role="tab" data-ui="tabs-trigger" id="tab-breakdown" data-view="breakdown" aria-controls="panel-breakdown">Breakdown</button>
        </div>
        <button type="button" id="export-button" data-ui="button" data-variant="outline" data-size="sm" popovertarget="export-menu" aria-haspopup="menu"></button>
        <div id="export-menu" popover data-ui="menu" class="w-60" role="menu" aria-label="Export">
          <button type="button" role="menuitem" data-ui="menu-item" data-export="xlsx"></button>
          <button type="button" role="menuitem" data-ui="menu-item" data-export="entries"></button>
          <button type="button" role="menuitem" data-ui="menu-item" data-export="csv"></button>
        </div>
      </div>
      <p id="export-status" class="-mt-4 text-right text-xs text-muted-foreground empty:hidden" role="status"></p>

      <!-- Timesheet -->
      <section id="panel-timesheet" role="tabpanel" aria-labelledby="tab-timesheet" class="flex min-w-0 flex-col gap-6">
        <div data-ui="card" class="min-w-0 overflow-hidden">
          <div data-ui="card-header" class="pb-4">
            <h2 id="timesheet-title" data-ui="card-title" class="text-base"></h2>
            <p id="timesheet-note" data-ui="card-description" class="empty:hidden"></p>
          </div>
          <div id="timesheet"></div>
        </div>
      </section>

      <!-- Summary: a line of totals, time per day or week by project, and shares by the grouping. -->
      <section id="panel-summary" role="tabpanel" aria-labelledby="tab-summary" class="flex min-w-0 flex-col gap-6" hidden>
        <div data-ui="card" class="min-w-0">
          <div data-ui="card-header" class="flex-row flex-wrap items-start justify-between gap-2 space-y-0 pb-4">
            <div class="grid min-w-0 gap-1.5">
              <h2 id="chart-title" data-ui="card-title" class="text-base"></h2>
              <p id="stats" data-ui="card-description" class="flex flex-wrap gap-x-3 gap-y-1"></p>
            </div>
            <div data-ui="tabs-list" role="tablist" aria-label="Chart or table" class="h-9">
              <button type="button" role="tab" data-ui="tabs-trigger" aria-controls="chart-panel" aria-selected="true" class="py-1">Chart</button>
              <button type="button" role="tab" data-ui="tabs-trigger" aria-controls="chart-table-panel" class="py-1">Table</button>
            </div>
          </div>
          <div data-ui="card-content" class="grid grid-cols-[minmax(0,1fr)] gap-4">
            <div id="chart-panel" role="tabpanel" class="grid grid-cols-[minmax(0,1fr)] gap-4">
              <ul id="chart-legend" class="flex flex-wrap gap-x-4 gap-y-1.5 text-xs" aria-label="Projects"></ul>
              <div id="chart" class="relative"></div>
            </div>
            <div id="chart-table-panel" role="tabpanel" hidden></div>
          </div>
        </div>
        <div data-ui="card" class="min-w-0">
          <div data-ui="card-header" class="pb-4">
            <h2 id="breakdown-title" data-ui="card-title" class="text-base"></h2>
            <p id="breakdown-note" data-ui="card-description" class="empty:hidden"></p>
          </div>
          <div id="summary-breakdown" data-ui="card-content"></div>
        </div>
      </section>

      <!-- Breakdown -->
      <section id="panel-breakdown" role="tabpanel" aria-labelledby="tab-breakdown" class="min-w-0" hidden>
        <div data-ui="card" class="min-w-0">
          <div data-ui="card-header" class="flex-row flex-wrap items-baseline justify-between gap-2 space-y-0">
            <div class="grid gap-1.5">
              <h2 id="outline-title" data-ui="card-title" class="text-base"></h2>
              <p id="outline-note" data-ui="card-description" class="empty:hidden"></p>
            </div>
            <p id="outline-total" class="text-2xl tabular-nums"></p>
          </div>
          <div id="outline" data-ui="card-content"></div>
        </div>
      </section>

      <!-- Entries (task 055): the entries behind the report, or behind the part chosen in a view. -->
      <section aria-label="Entries" class="min-w-0">
        <div id="entries-card" data-ui="card" class="min-w-0 scroll-mt-4 overflow-hidden">
          <div id="entries-header" data-ui="card-header" class="flex-row flex-wrap items-start justify-between gap-2 space-y-0">
            <div class="grid min-w-0 gap-1.5">
              <h2 data-ui="card-title" class="text-base">
                <button type="button" id="entries-toggle" class="-mx-1 flex items-center gap-1.5 rounded-sm px-1 hover:text-foreground/80 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-controls="entries" aria-expanded="false"><span id="entries-chevron" class="flex"></span>Entries</button>
              </h2>
              <div id="entries-note" data-ui="card-description" class="flex flex-wrap items-center gap-x-2 gap-y-1"></div>
            </div>
            <div id="entries-views" data-ui="toggle-group" role="group" aria-label="List entries" class="justify-start">
              <button type="button" data-ui="toggle" data-variant="outline" data-size="sm" data-entry-view="day">By day</button>
              <button type="button" data-ui="toggle" data-variant="outline" data-size="sm" data-entry-view="description">By description</button>
            </div>
          </div>
          <div id="entries"></div>
        </div>
      </section>
    </main>

    <div id="chart-tooltip" role="tooltip" class="pointer-events-none fixed z-50 hidden min-w-44 max-w-72 rounded-md border bg-popover px-3 py-2 text-xs text-popover-foreground shadow-md"></div>

    <script>
      appFrame.mount({ page: 'reports', title: 'Reports', scene: true })
      // Marks the timesheet while it's scrolled sideways, for its sticky column's background.
      document.addEventListener(
        'scroll',
        (event) => {
          const table = event.target.querySelector?.(':scope > .timesheet')
          table?.toggleAttribute('data-scrolled', event.target.scrollLeft > 0)
        },
        true
      )
      const { escapeHtml, icon } = appFrame
      const { tz: Z, HOUR, colorVar } = appData
      const ME = appData.currentUserId

      const state = {
        fixture: 'populated',
        // The user's time zone and week start, from user_settings (Settings page).
        zone: appFrame.settings.get().timeZone,
        weekStart: appFrame.settings.get().weekStart,
        preset: 'this-week',
        from: 0, // first day start (inclusive)
        to: 0, // day start after the last day (exclusive)
        scope: 'default',
        // The report's view, one of the tabs: timesheet, summary, or breakdown.
        view: 'timesheet',
        group: 'project',
        // A project's ID, 'none' for time without one, or null for all projects.
        project: null,
        unit: 'day',
        org: null,
        entries: [],
        // The Entries card: the timesheet part it's narrowed to ({ row, bucket }, either null),
        // the view the user picked (null follows the range), and how many days or rows show.
        narrow: null,
        entryView: null,
        entryLimit: null,
      }

      // --- Formatting ---------------------------------------------------------------------------
      const hm = (ms) => {
        const m = Math.round(ms / 60_000)
        return `${Math.floor(m / 60)}:${String(m % 60).padStart(2, '0')}`
      }
      const fmt = (opts) => new Intl.DateTimeFormat(undefined, { timeZone: state.zone, ...opts })
      const dateValue = (t) => {
        const p = Z.zonedParts(t, state.zone)
        return `${p.y}-${String(p.m).padStart(2, '0')}-${String(p.d).padStart(2, '0')}`
      }
      const fromDateValue = (v) => {
        const [y, m, d] = v.split('-').map(Number)
        return Z.zonedTime(y, m, d, 0, 0, state.zone)
      }
      const dot = (color, cls = 'size-2') => `<span class="inline-block ${cls} shrink-0 rounded-full" style="background:${color}" aria-hidden="true"></span>`
      const NO_PROJECT = { id: 'none', name: 'No project', color: 'var(--muted-foreground)' }

      // --- Visibility (docs/architecture.md, Tenancy) -------------------------------------------
      const role = () => appFrame.role
      const ledTeams = () => state.org.teams.filter((t) => t.members.some(([u, r]) => u === ME && r === 'lead'))
      function visibleUsers() {
        if (appFrame.isAdmin()) return new Set(state.org.members.map((m) => m.id))
        const ids = new Set([ME])
        if (role() === 'lead') ledTeams().forEach((t) => t.members.forEach(([u]) => ids.add(u)))
        return ids
      }
      const visibleTeams = () => (appFrame.isAdmin() ? state.org.teams : role() === 'lead' ? ledTeams() : [])
      const member = (id) => state.org.members.find((m) => m.id === id)
      const project = (id) => state.org.projects.find((p) => p.id === id) ?? NO_PROJECT

      function scopeOptions() {
        const opt = (value, label) => `<option value="${value}">${escapeHtml(label)}</option>`
        const people = (ids) =>
          [...ids]
            .map(member)
            .sort((a, b) => a.name.localeCompare(b.name))
            .map((m) => opt(`user:${m.id}`, m.id === ME ? `${m.name} (you)` : m.name))
            .join('')
        if (appFrame.isAdmin())
          return `${opt('default', 'Everyone')}<optgroup label="Teams">${state.org.teams.map((t) => opt(`team:${t.id}`, t.name)).join('')}</optgroup><optgroup label="Members">${people(visibleUsers())}</optgroup>`
        const teams = ledTeams()
        return `${opt('default', teams.length > 1 ? 'My teams' : teams[0].name)}${teams.length > 1 ? `<optgroup label="Teams">${teams.map((t) => opt(`team:${t.id}`, t.name)).join('')}</optgroup>` : ''}<optgroup label="Members">${people(visibleUsers())}</optgroup>`
      }

      // Every role can narrow to a project: all, time without one, the active projects by name,
      // then the archived ones, whose entries still count.
      function projectOptions() {
        const opt = (value, label) => `<option value="${value}">${escapeHtml(label)}</option>`
        const byName = (list) => [...list].sort((a, b) => a.name.localeCompare(b.name)).map((p) => opt(p.id, p.name)).join('')
        const active = state.org.projects.filter((p) => !p.archivedAt)
        const archived = state.org.projects.filter((p) => p.archivedAt)
        return `${opt('', 'All projects')}${opt('none', 'No project')}<optgroup label="Projects">${byName(active)}</optgroup>${archived.length ? `<optgroup label="Archived">${byName(archived)}</optgroup>` : ''}`
      }

      function scopedUsers() {
        const all = visibleUsers()
        if (state.scope.startsWith('user:')) return new Set([state.scope.slice(5)])
        if (state.scope.startsWith('team:')) return new Set(state.org.teams.find((t) => t.id === state.scope.slice(5)).members.map(([u]) => u))
        return all
      }

      // --- Aggregation (the reports module, task 007) -------------------------------------------
      // Entries are clipped to the range and split at day boundaries in the user's zone; the
      // running entry counts up to now.
      function segments() {
        const users = scopedUsers()
        const now = Date.now()
        const out = []
        let split = 0
        for (const e of state.entries) {
          if (!users.has(e.userId)) continue
          if (state.project && (e.projectId ?? 'none') !== state.project) continue
          let s = Math.max(e.startedAt, state.from)
          const end = Math.min(e.stoppedAt ?? now, state.to)
          if (s >= end) continue
          let day = Z.startOfDay(s, state.zone)
          let parts = 0
          while (s < end) {
            const next = Z.addDays(day, 1, state.zone)
            out.push({ entry: e, day, ms: Math.min(end, next) - s })
            s = next
            day = next
            parts++
          }
          if (parts > 1) split++
        }
        return { segs: out, split }
      }

      function buckets() {
        const list = []
        if (state.unit === 'week') {
          for (let w = Z.startOfWeek(state.from, state.zone, state.weekStart); w < state.to; w = Z.addDays(w, 7, state.zone)) list.push(w)
        } else for (let d = state.from; d < state.to; d = Z.addDays(d, 1, state.zone)) list.push(d)
        return list
      }
      const bucketOf = (day) => (state.unit === 'week' ? Z.startOfWeek(day, state.zone, state.weekStart) : day)

      // Ticket keys (prototype): fixed per description, and none for about a quarter of them.
      function ticketOf(entry) {
        if (!entry.description) return null
        let h = 0
        for (const c of entry.description) h = (h * 31 + c.charCodeAt(0)) >>> 0
        return h % 4 === 0 ? null : `SNOW-${100 + (h % 60)}`
      }

      // Keys for the grouping dimension. A member in several teams counts in each (current members).
      function keysFor(entry, group) {
        if (group === 'project') return [entry.projectId ?? 'none']
        if (group === 'ticket') return [ticketOf(entry) ?? 'none']
        if (group === 'member') return [entry.userId]
        const teams = visibleTeams().filter((t) => t.members.some(([u]) => u === entry.userId))
        if (teams.length) return teams.map((t) => t.id)
        return appFrame.isAdmin() ? ['no-team'] : []
      }
      function labelFor(key, group) {
        if (group === 'project') {
          const p = project(key)
          return { name: p.name, color: colorVar(p.color), archived: !!p.archivedAt }
        }
        if (group === 'ticket') return key === 'none' ? { name: 'No ticket', muted: true } : { name: key }
        if (group === 'member') {
          const m = member(key)
          return { name: key === ME ? `${m.name} (you)` : m.name }
        }
        return { name: key === 'no-team' ? 'No team' : state.org.teams.find((t) => t.id === key).name, muted: key === 'no-team' }
      }

      function rowsBy(segs, group) {
        const rows = new Map()
        for (const s of segs)
          for (const key of keysFor(s.entry, group)) {
            if (!rows.has(key)) rows.set(key, { key, ...labelFor(key, group), total: 0, byBucket: new Map(), segs: [] })
            const r = rows.get(key)
            const b = bucketOf(s.day)
            r.total += s.ms
            r.byBucket.set(b, (r.byBucket.get(b) ?? 0) + s.ms)
            r.segs.push(s)
          }
        return [...rows.values()].sort((a, b) => b.total - a.total || a.name.localeCompare(b.name))
      }

      // --- Range --------------------------------------------------------------------------------
      function setPreset(preset, anchor = Date.now()) {
        const tz = state.zone
        const today = Z.startOfDay(anchor, tz)
        const p = Z.zonedParts(today + 12 * HOUR, tz)
        const monthStart = (y, m) => Z.zonedTime(y, m, 1, 0, 0, tz)
        const ranges = {
          today: [today, Z.addDays(today, 1, tz)],
          'this-week': [Z.startOfWeek(today, tz, state.weekStart), Z.addDays(Z.startOfWeek(today, tz, state.weekStart), 7, tz)],
          'last-week': [Z.addDays(Z.startOfWeek(today, tz, state.weekStart), -7, tz), Z.startOfWeek(today, tz, state.weekStart)],
          'this-month': [monthStart(p.y, p.m), monthStart(p.y, p.m + 1)],
          'last-month': [monthStart(p.y, p.m - 1), monthStart(p.y, p.m)],
        }
        state.preset = preset
        if (ranges[preset]) [state.from, state.to] = ranges[preset]
        state.unit = daysInRange() > 35 ? 'week' : 'day'
      }
      const daysInRange = () => Math.round((state.to - state.from) / (24 * HOUR))

      function shiftRange(dir) {
        const tz = state.zone
        if (state.preset === 'this-month' || state.preset === 'last-month') {
          const p = Z.zonedParts(state.from + 12 * HOUR, tz)
          state.from = Z.zonedTime(p.y, p.m + dir, 1, 0, 0, tz)
          state.to = Z.zonedTime(p.y, p.m + dir + 1, 1, 0, 0, tz)
        } else {
          const n = daysInRange()
          state.from = Z.addDays(state.from, dir * n, tz)
          state.to = Z.addDays(state.to, dir * n, tz)
        }
        state.preset = matchPreset()
      }
      // A shifted range that lands on a preset shows that preset again.
      function matchPreset() {
        const { from, to } = state
        for (const p of ['today', 'this-week', 'last-week', 'this-month', 'last-month']) {
          setPreset(p)
          if (state.from === from && state.to === to) return p
        }
        state.from = from
        state.to = to
        return 'custom'
      }

      function rangeLabel() {
        const last = Z.addDays(state.to, -1, state.zone)
        const f = fmt({ day: 'numeric', month: 'short', year: 'numeric' })
        return state.from === last ? fmt({ weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(state.from) : f.formatRange(state.from, last + 12 * HOUR)
      }

      // --- Rendering: shared --------------------------------------------------------------------
      function emptyState(text = 'No time tracked in this range.') {
        return `<div class="surface flex flex-col items-center gap-2 rounded-lg border border-dashed px-6 py-10 text-center">
          ${icon('chart-column', 'size-6 text-muted-foreground')}
          <p class="font-medium">${text}</p>
          <p class="text-sm text-muted-foreground">Pick another range or other people.</p>
        </div>`
      }
      const groupNoun = () => ({ project: 'project', ticket: 'ticket', team: 'team', member: 'member' })[state.group]
      const teamNote = () =>
        state.group === 'team' ? 'Teams count the time of their current members, so someone in two teams counts in both and team totals can add up to more than the total.' : ''

      function bucketLabel(b, short) {
        if (state.unit === 'week') return short ? fmt({ day: 'numeric', month: 'short' }).format(b + 12 * HOUR) : `Week of ${fmt({ day: 'numeric', month: 'short' }).format(b + 12 * HOUR)}`
        return short ? fmt(daysInRange() <= 7 ? { weekday: 'short', day: 'numeric' } : { day: 'numeric' }).format(b + 12 * HOUR) : fmt({ weekday: 'short', day: 'numeric', month: 'short' }).format(b + 12 * HOUR)
      }
      const isCurrent = (b) => {
        const today = Z.startOfDay(Date.now(), state.zone)
        return state.unit === 'week' ? b === Z.startOfWeek(today, state.zone, state.weekStart) : b === today
      }

      function shareBar(fraction, color) {
        return `<div data-ui="progress" class="h-1.5" aria-hidden="true"><div data-ui="progress-fill" style="width:${Math.max(0, fraction * 100).toFixed(1)}%${color ? `;background:${color}` : ''}"></div></div>`
      }

      // --- Summary ------------------------------------------------------------------------------
      // One line over the chart: the total, the average tracked day, and the top project.
      function renderStats(segs) {
        const total = segs.reduce((s, x) => s + x.ms, 0)
        const today = Z.startOfDay(Date.now(), state.zone)
        let elapsed = 0
        for (let d = state.from; d < state.to && d <= today; d = Z.addDays(d, 1, state.zone)) elapsed++
        const days = new Set(segs.map((s) => s.day)).size
        const top = rowsBy(segs, 'project')[0]
        const value = (text) => `<span class="font-medium tabular-nums text-foreground">${text}</span>`
        const parts = [
          `Total ${value(hm(total))}`,
          `Average ${value(days ? hm(total / days) : '0:00')} a day, over ${days} of ${elapsed} ${elapsed === 1 ? 'day' : 'days'}`,
          top &&
            `<span class="inline-flex min-w-0 max-w-full items-center gap-1.5">Top project ${dot(top.color)}<span class="truncate font-medium text-foreground sm:max-w-56">${escapeHtml(top.name)}</span> ${Math.round((top.total / total) * 100)}%</span>`,
        ].filter(Boolean)
        document.getElementById('stats').innerHTML = parts.map((p) => `<span class="min-w-0">${p}</span>`).join('<span aria-hidden="true" class="hidden sm:inline">·</span>')
      }

      // Stacked columns by project. At most eight series: the smallest projects fold into "Other".
      function chartSeries(segs) {
        const rows = rowsBy(segs, 'project')
        if (rows.length <= 8) return rows
        const kept = rows.slice(0, 7)
        const rest = rows.slice(7)
        const other = { key: 'other', name: `Other (${rest.length} projects)`, color: 'var(--muted-foreground)', total: 0, byBucket: new Map() }
        for (const r of rest) {
          other.total += r.total
          for (const [b, ms] of r.byBucket) other.byBucket.set(b, (other.byBucket.get(b) ?? 0) + ms)
        }
        return [...kept, other]
      }

      function niceStep(maxHours) {
        for (const s of [0.5, 1, 2, 4, 5, 8, 10, 20, 25, 40, 50, 100, 200]) if (maxHours / s <= 4) return s
        return 500
      }

      let chartModel = null
      function renderChart(segs) {
        const series = chartSeries(segs)
        const bs = buckets()
        const unitWord = state.unit === 'week' ? 'week' : 'day'
        document.getElementById('chart-title').textContent = `Time per ${unitWord}`
        const legend = document.getElementById('chart-legend')
        const chart = document.getElementById('chart')
        if (!series.length) {
          legend.innerHTML = ''
          chart.innerHTML = emptyState()
          document.getElementById('chart-table-panel').innerHTML = emptyState()
          chartModel = null
          return
        }
        legend.innerHTML = series
          .map((s) => `<li class="flex min-w-0 max-w-full items-center gap-1.5">${dot(s.color)}<span class="truncate sm:max-w-56">${escapeHtml(s.name)}</span><span class="tabular-nums text-muted-foreground">${hm(s.total)}</span></li>`)
          .join('')

        const W = Math.max(280, chart.clientWidth || 600)
        const H = 220
        const left = 36
        const bottom = 22
        const top = 8
        const plotW = W - left - 4
        const plotH = H - top - bottom
        const totals = bs.map((b) => series.reduce((s, x) => s + (x.byBucket.get(b) ?? 0), 0))
        const maxH = Math.max(1, ...totals.map((t) => t / HOUR))
        const step = niceStep(maxH)
        const yMax = Math.ceil(maxH / step) * step
        const y = (h) => top + plotH - (h / yMax) * plotH
        const band = plotW / bs.length
        const barW = Math.max(3, Math.min(24, band * 0.62))
        const every = Math.ceil(bs.length / Math.max(1, Math.floor(plotW / 44)))
        let svg = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="group" aria-label="Stacked columns of time per ${unitWord} by project; choose one to list its entries. The Table tab lists the same values." class="block overflow-visible">`
        for (let v = 0; v <= yMax + 1e-9; v += step)
          svg += `<line class="chart-grid" x1="${left}" x2="${W}" y1="${y(v)}" y2="${y(v)}" /><text x="${left - 8}" y="${y(v)}" dy="0.32em" text-anchor="end" class="fill-muted-foreground text-[10px] tabular-nums">${v}h</text>`
        bs.forEach((b, i) => {
          const x = left + i * band + (band - barW) / 2
          let acc = 0
          const stack = series.map((s) => ({ s, ms: s.byBucket.get(b) ?? 0 })).filter((x) => x.ms > 0)
          let marks = ''
          stack.forEach(({ s, ms }, j) => {
            const y0 = y(acc / HOUR)
            acc += ms
            const y1 = y(acc / HOUR)
            // A 2px surface gap between stacked segments; the top segment gets 4px rounded corners.
            const hgt = Math.max(0, y0 - y1 - (j > 0 ? 2 : 0))
            const yTop = y1
            if (hgt <= 0) return
            const r = j === stack.length - 1 ? Math.min(4, barW / 2, hgt) : 0
            marks += `<path d="M${x},${yTop + hgt} V${yTop + r} Q${x},${yTop} ${x + r},${yTop} H${x + barW - r} Q${x + barW},${yTop} ${x + barW},${yTop + r} V${yTop + hgt} Z" style="fill:${s.color}" />`
          })
          const label = i % every === 0 ? `<text x="${left + i * band + band / 2}" y="${H - 6}" text-anchor="middle" class="${isCurrent(b) ? 'fill-foreground font-medium' : 'fill-muted-foreground'} text-[10px]">${escapeHtml(bucketLabel(b, true))}</text>` : ''
          const picked = !!state.narrow && state.narrow.row == null && state.narrow.bucket === b
          svg += `<g class="chart-band" role="button" tabindex="0" data-bucket="${i}" aria-pressed="${picked}" aria-label="${escapeHtml(`Entries for ${bucketLabel(b, false)}, ${hm(totals[i])}`)}">
            <rect class="chart-hit fill-transparent" x="${left + i * band}" y="${top}" width="${band}" height="${plotH}" rx="4" />${marks}</g>${label}`
        })
        svg += `<line x1="${left}" x2="${W}" y1="${y(0)}" y2="${y(0)}" class="stroke-muted-foreground/40" /></svg>`
        chart.innerHTML = svg
        chartModel = { series, bs, totals }

        // Table view with the same values.
        document.getElementById('chart-table-panel').innerHTML = `<div class="relative w-full overflow-auto rounded-md border">
          <table data-ui="table" class="min-w-[28rem]">
            <thead data-ui="table-header"><tr data-ui="table-row"><th data-ui="table-head">${state.unit === 'week' ? 'Week' : 'Day'}</th>${series.map((s) => `<th data-ui="table-head" class="text-right"><span class="inline-flex max-w-40 items-center gap-1.5">${dot(s.color)}<span class="truncate">${escapeHtml(s.name)}</span></span></th>`).join('')}<th data-ui="table-head" class="text-right">Total</th></tr></thead>
            <tbody data-ui="table-body">${bs
              .map(
                (b, i) => `<tr data-ui="table-row"><td data-ui="table-cell" class="whitespace-nowrap">${escapeHtml(bucketLabel(b, false))}</td>${series
                  .map((s) => `<td data-ui="table-cell" class="text-right tabular-nums ${s.byBucket.get(b) ? '' : 'text-muted-foreground'}">${s.byBucket.get(b) ? hm(s.byBucket.get(b)) : '—'}</td>`)
                  .join('')}<td data-ui="table-cell" class="text-right font-medium tabular-nums">${hm(totals[i])}</td></tr>`
              )
              .join('')}</tbody>
          </table></div>`
      }

      // Tooltip for one column: every series at that bucket, values first.
      const tooltip = document.getElementById('chart-tooltip')
      function showTooltip(band, clientX, clientY) {
        if (!chartModel) return
        const i = +band.dataset.bucket
        const b = chartModel.bs[i]
        const rows = chartModel.series.map((s) => ({ s, ms: s.byBucket.get(b) ?? 0 })).filter((x) => x.ms > 0)
        tooltip.innerHTML = `<p class="mb-1.5 font-medium">${escapeHtml(bucketLabel(b, false))} · <span class="tabular-nums">${hm(chartModel.totals[i])}</span></p>${
          rows.length
            ? `<ul class="grid gap-1">${rows
                .reverse()
                .map(({ s, ms }) => `<li class="flex min-w-0 items-center gap-2"><span class="w-10 shrink-0 font-medium tabular-nums">${hm(ms)}</span>${dot(s.color)}<span class="min-w-0 truncate text-muted-foreground">${escapeHtml(s.name)}</span></li>`)
                .join('')}</ul>`
            : '<p class="text-muted-foreground">No time</p>'
        }`
        tooltip.classList.remove('hidden')
        const r = tooltip.getBoundingClientRect()
        tooltip.style.left = `${Math.max(8, Math.min(clientX + 12, innerWidth - r.width - 8))}px`
        tooltip.style.top = `${Math.max(8, clientY - r.height - 12)}px`
      }
      const chartEl = document.getElementById('chart')
      chartEl.addEventListener('pointermove', (event) => {
        const band = event.target.closest('.chart-band')
        band ? showTooltip(band, event.clientX, event.clientY) : tooltip.classList.add('hidden')
      })
      chartEl.addEventListener('pointerleave', () => tooltip.classList.add('hidden'))
      chartEl.addEventListener('focusin', (event) => {
        const band = event.target.closest('.chart-band')
        if (!band) return
        const r = band.getBoundingClientRect()
        showTooltip(band, r.left + r.width / 2, r.top + 40)
      })
      chartEl.addEventListener('focusout', () => tooltip.classList.add('hidden'))
      new ResizeObserver(() => state.view === 'summary' && chartModel && renderChart(segments().segs)).observe(chartEl)
      // A column narrows the Entries card to its day or week, like a total in the timesheet.
      chartEl.addEventListener('click', (event) => {
        const band = event.target.closest('.chart-band')
        if (!band) return
        const b = chartModel.bs[+band.dataset.bucket]
        narrowTo(null, b, () => chartEl.querySelector(`.chart-band[data-bucket="${band.dataset.bucket}"]`))
      })
      chartEl.addEventListener('keydown', (event) => {
        const band = event.target.closest('.chart-band')
        if (!band || (event.key !== 'Enter' && event.key !== ' ')) return
        event.preventDefault()
        band.dispatchEvent(new MouseEvent('click', { bubbles: true }))
      })

      function renderSummaryBreakdown(segs) {
        const rows = rowsBy(segs, state.group)
        const total = segs.reduce((s, x) => s + x.ms, 0)
        document.getElementById('breakdown-title').textContent = `By ${groupNoun()}`
        document.getElementById('breakdown-note').textContent = teamNote()
        document.getElementById('summary-breakdown').innerHTML = rows.length
          ? `<ul class="grid gap-3">${rows
              .map(
                (r) => `<li class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-1.5 text-sm">
                  <span class="flex min-w-0 items-center gap-2">${pickButton(r.key, null, r.name, `${r.color ? dot(r.color) : ''}<span class="truncate ${r.muted ? 'text-muted-foreground' : ''}">${escapeHtml(r.name)}</span>`, 'flex min-w-0 max-w-full items-center gap-2 text-left')}${r.archived ? '<span data-ui="badge" data-variant="outline" class="px-1.5 text-[10px]">Archived</span>' : ''}</span>
                  <span class="flex items-baseline gap-3"><span class="w-10 text-right text-xs text-muted-foreground">${Math.round((r.total / total) * 100)}%</span><span class="w-14 text-right tabular-nums">${hm(r.total)}</span></span>
                  <div class="col-span-2">${shareBar(r.total / total, r.color)}</div>
                </li>`
              )
              .join('')}</ul>`
          : emptyState()
      }

      // Names and totals in every view are buttons that narrow the Entries card to their row,
      // bucket, or both.
      function pickButton(row, b, label, content, cls = '') {
        const n = state.narrow
        const pressed = !!n && n.row === row && n.bucket === b
        return `<button type="button" class="ts-pick ${cls}" data-row="${row ?? ''}" data-bucket="${b ?? ''}" aria-pressed="${pressed}" aria-label="${escapeHtml(`Entries for ${label}`)}">${content}</button>`
      }

      // --- Timesheet ----------------------------------------------------------------------------
      function renderTimesheet(segs) {
        const rows = rowsBy(segs, state.group)
        const bs = buckets()
        document.getElementById('timesheet-title').textContent = `${groupNoun()[0].toUpperCase()}${groupNoun().slice(1)}s by ${state.unit}`
        document.getElementById('timesheet-note').textContent = teamNote()
        const el = document.getElementById('timesheet')
        if (!rows.length) return (el.innerHTML = `<div class="px-6 pb-6">${emptyState()}</div>`)
        const colTotal = (b) => {
          // The total row counts each segment once, even when a member is in two teams.
          return segs.filter((s) => bucketOf(s.day) === b).reduce((a, s) => a + s.ms, 0)
        }
        const grand = segs.reduce((a, s) => a + s.ms, 0)
        const head = (b) => `<th data-ui="table-head" class="min-w-16 whitespace-nowrap text-right ${isCurrent(b) ? 'text-foreground' : ''}" scope="col">${escapeHtml(bucketLabel(b, true))}${state.unit === 'day' && daysInRange() > 7 ? `<span class="block text-[10px] font-normal">${escapeHtml(fmt({ weekday: 'narrow' }).format(b + 12 * HOUR))}</span>` : ''}</th>`
        const pick = pickButton
        const cell = (ms, b, row, name, extra = '') =>
          `<td data-ui="table-cell" class="whitespace-nowrap text-right tabular-nums ${isCurrent(b) ? 'bg-muted/50' : ''} ${ms ? '' : 'text-muted-foreground/50'} ${extra}">${ms ? pick(row, b, [name, bucketLabel(b, false)].filter(Boolean).join(', '), hm(ms)) : '·'}</td>`
        el.innerHTML = `<div class="relative w-full overflow-auto border-t">
          <table data-ui="table" class="timesheet">
            <thead data-ui="table-header"><tr data-ui="table-row"><th data-ui="table-head" class="min-w-36 max-w-40 pl-6 sm:max-w-64" scope="col">${escapeHtml(groupNoun()[0].toUpperCase() + groupNoun().slice(1))}</th>${bs.map(head).join('')}<th data-ui="table-head" class="pr-6 text-right" scope="col">Total</th></tr></thead>
            <tbody data-ui="table-body">${rows
              .map(
                (r) => `<tr data-ui="table-row"><th data-ui="table-cell" scope="row" class="max-w-40 pl-6 text-left font-normal sm:max-w-64">${pick(r.key, null, r.name, `${r.color ? dot(r.color) : ''}<span class="truncate ${r.muted ? 'text-muted-foreground' : ''}" title="${escapeHtml(r.name)}">${escapeHtml(r.name)}</span>`, 'flex min-w-0 max-w-full items-center gap-2 text-left')}</th>${bs.map((b) => cell(r.byBucket.get(b) ?? 0, b, r.key, r.name)).join('')}<td data-ui="table-cell" class="pr-6 text-right font-medium tabular-nums">${pick(r.key, null, r.name, hm(r.total))}</td></tr>`
              )
              .join('')}
              <tr data-ui="table-row" class="border-t-2 font-medium hover:bg-transparent"><th data-ui="table-cell" scope="row" class="pl-6 text-left">Total</th>${bs.map((b) => cell(colTotal(b), b, null, '', 'font-medium')).join('')}<td data-ui="table-cell" class="pr-6 text-right tabular-nums">${hm(grand)}</td></tr>
            </tbody>
          </table></div>`
      }

      // --- Entries (task 055) --------------------------------------------------------------------
      // The same day pieces the timesheet sums, so the list adds up to the chosen totals. Newest
      // first, as on the Timer page; with several people, a day lists each person's entries together. Read-only: only the owner edits an entry, on the Timer page.
      // Kept in this browser: whether the list is open (it starts closed, showing only the header)
      // and whether the user has narrowed it, after which the hint no longer shows.
      const readFlag = (key) => {
        try {
          return localStorage.getItem(key) === '1'
        } catch {
          return false
        }
      }
      const writeFlag = (key, on) => {
        try {
          if (on) localStorage.setItem(key, '1')
          else localStorage.removeItem(key)
        } catch {}
      }
      let entriesOpen = readFlag('snowtime.reportEntriesOpen')
      let narrowedOnce = readFlag('snowtime.reportEntriesNarrowed')
      function setEntriesOpen(open) {
        entriesOpen = open
        writeFlag('snowtime.reportEntriesOpen', open)
      }
      const DAY_PAGE = 7
      const DESCRIPTION_PAGE = 25
      const clock = (t) => fmt({ hour: '2-digit', minute: '2-digit' }).format(t)

      function narrowedSegments(segs) {
        const n = state.narrow
        if (!n) return segs
        return segs.filter((s) => (n.row == null || keysFor(s.entry, state.group).includes(n.row)) && (n.bucket == null || bucketOf(s.day) === n.bucket))
      }
      function narrowLabel() {
        const n = state.narrow
        return [n.row != null && labelFor(n.row, state.group).name, n.bucket != null && bucketLabel(n.bucket, false)].filter(Boolean).join(' · ')
      }
      // Up to a week of days lists entries by day; longer spans merge them by description.
      function entryView() {
        if (state.entryView) return state.entryView
        const n = state.narrow
        const days = n?.bucket != null ? (state.unit === 'week' ? 7 : 1) : daysInRange()
        return days > 7 ? 'description' : 'day'
      }
      // A member column only when the list can hold more than one person.
      function manyPeople() {
        const n = state.narrow
        return scopedUsers().size > 1 && !(state.group === 'member' && n?.row != null)
      }
      const personName = (id) => (id === ME ? `${member(id).name} (you)` : member(id).name)
      const projectLabel = (id) => {
        const p = project(id ?? 'none')
        return `<span class="flex min-w-0 items-center gap-2">${dot(colorVar(p.color))}<span class="truncate">${escapeHtml(p.name)}</span></span>`
      }
      const descriptionText = (d) => (d ? escapeHtml(d) : '<span class="italic text-muted-foreground">No description</span>')

      function entryRow(s, many) {
        const e = s.entry
        const end = e.stoppedAt ?? Date.now()
        const split = e.startedAt < s.day || end > Z.addDays(s.day, 1, state.zone)
        const span = `${clock(e.startedAt)} – ${e.stoppedAt ? clock(e.stoppedAt) : 'now'}`
        const marks = `${split ? `<span title="Crosses midnight: ${hm(s.ms)} counts on this day">${icon('moon', 'size-3.5')}<span class="sr-only">, crosses midnight, ${hm(s.ms)} counts on this day</span></span>` : ''}${e.stoppedAt ? '' : '<span data-ui="badge" data-variant="secondary" class="px-1.5 py-0 text-[10px]">Running</span>'}`
        return `<li class="flex items-start gap-4 border-b px-6 py-2.5 text-sm last:border-b-0">
          <span class="hidden w-32 shrink-0 items-center gap-1.5 whitespace-nowrap tabular-nums text-muted-foreground sm:flex">${span}${marks}</span>
          <div class="grid min-w-0 flex-1 gap-0.5 ${many ? 'sm:grid-cols-[minmax(0,1fr)_minmax(0,12rem)_minmax(0,9rem)]' : 'sm:grid-cols-[minmax(0,1fr)_minmax(0,12rem)]'} sm:items-center sm:gap-4">
            <span class="truncate" title="${escapeHtml(e.description)}">${descriptionText(e.description)}</span>
            <div class="flex min-w-0 flex-wrap items-center gap-x-3 gap-y-0.5 text-muted-foreground sm:contents">
              <span class="flex items-center gap-1.5 tabular-nums sm:hidden">${span}${marks}</span>
              ${projectLabel(e.projectId)}
              ${many ? `<span class="truncate">${escapeHtml(personName(e.userId))}</span>` : ''}
            </div>
          </div>
          <span class="w-12 shrink-0 text-right font-medium tabular-nums">${hm(s.ms)}</span>
        </li>`
      }

      function byDay(list, many) {
        const days = new Map()
        for (const s of list) days.set(s.day, [...(days.get(s.day) ?? []), s])
        const sorted = [...days.entries()].sort((a, b) => b[0] - a[0])
        const shown = sorted.slice(0, state.entryLimit ?? DAY_PAGE)
        const rest = sorted.length - shown.length
        return {
          html: shown
            .map(
              ([day, segs]) => `<li>
                <h3 class="flex items-baseline justify-between gap-4 border-b bg-muted/50 px-6 py-1.5 text-sm font-medium"><span>${escapeHtml(fmt({ weekday: 'long', day: 'numeric', month: 'long' }).format(day + 12 * HOUR))}</span><span class="tabular-nums">${hm(segs.reduce((a, s) => a + s.ms, 0))}</span></h3>
                <ul>${segs
                  .sort((a, b) => (many ? personName(a.entry.userId).localeCompare(personName(b.entry.userId)) : 0) || b.entry.startedAt - a.entry.startedAt)
                  .map((s) => entryRow(s, many))
                  .join('')}</ul>
              </li>`
            )
            .join(''),
          more: rest > 0 ? `Show ${Math.min(DAY_PAGE, rest)} more ${Math.min(DAY_PAGE, rest) === 1 ? 'day' : 'days'}` : '',
          next: shown.length + DAY_PAGE,
        }
      }

      // One row per project and description, with its total, entries, days, and people.
      function byDescription(list, many) {
        const rows = new Map()
        for (const s of list) {
          const key = `${s.entry.projectId}\u0000${s.entry.description}`
          if (!rows.has(key)) rows.set(key, { entry: s.entry, total: 0, entries: new Set(), days: new Set(), users: new Set() })
          const r = rows.get(key)
          r.total += s.ms
          r.entries.add(s.entry.id)
          r.days.add(s.day)
          r.users.add(s.entry.userId)
        }
        const sorted = [...rows.values()].sort((a, b) => b.total - a.total || a.entry.description.localeCompare(b.entry.description))
        const shown = sorted.slice(0, state.entryLimit ?? DESCRIPTION_PAGE)
        const people = (ids) => {
          const names = [...ids].map(personName).sort((a, b) => a.localeCompare(b))
          return names.length > 3 ? `${names.slice(0, 2).join(', ')} and ${names.length - 2} more` : names.join(', ')
        }
        const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`
        // From 640 px a header names the columns once and the counts are bare numbers; screen
        // readers get them as a sentence instead. Below that, they wrap under the description.
        const cols = many
          ? 'sm:grid-cols-[minmax(0,1fr)_minmax(0,12rem)_minmax(0,12rem)_4.5rem_3.5rem_3.5rem]'
          : 'sm:grid-cols-[minmax(0,1fr)_minmax(0,12rem)_4.5rem_3.5rem_3.5rem]'
        const header = `<li aria-hidden="true" class="hidden gap-x-4 border-b bg-muted/50 px-6 py-1.5 text-xs font-medium text-muted-foreground sm:grid ${cols}">
          <span>Description</span><span>Project</span>${many ? '<span>People</span>' : ''}<span class="text-right">Entries</span><span class="text-right">Days</span><span class="text-right">Total</span>
        </li>`
        return {
          html:
            header +
            shown
              .map(
                (r) => `<li class="grid grid-cols-[minmax(0,1fr)_auto] gap-x-4 gap-y-0.5 border-b px-6 py-2.5 text-sm last:border-b-0 sm:items-center ${cols}">
                  <span class="truncate sm:col-start-1 sm:row-start-1" title="${escapeHtml(r.entry.description)}">${descriptionText(r.entry.description)}</span>
                  <span class="col-start-2 row-start-1 text-right font-medium tabular-nums sm:col-start-auto sm:col-end-[-1]">${hm(r.total)}</span>
                  <div class="col-span-2 flex min-w-0 flex-wrap items-center gap-x-3 gap-y-0.5 text-muted-foreground sm:contents">
                    <span class="min-w-0 sm:col-start-2 sm:row-start-1">${projectLabel(r.entry.projectId)}</span>
                    <span class="sm:sr-only">${plural(r.entries.size, 'entry', 'entries')} on ${plural(r.days.size, 'day', 'days')}</span>
                    ${many ? `<span class="min-w-0 truncate sm:col-start-3 sm:row-start-1">${escapeHtml(people(r.users))}</span>` : ''}
                    <span aria-hidden="true" class="hidden text-right tabular-nums sm:col-start-[-4] sm:row-start-1 sm:block">${r.entries.size}</span>
                    <span aria-hidden="true" class="hidden text-right tabular-nums sm:col-start-[-3] sm:row-start-1 sm:block">${r.days.size}</span>
                  </div>
                </li>`
              )
              .join(''),
          more: sorted.length > shown.length ? `Show all ${sorted.length}` : '',
          next: sorted.length,
        }
      }

      const NARROW_HINT = {
        timesheet: 'Choose a name or a total in the timesheet to narrow the list.',
        summary: 'Choose a column in the chart or a name to narrow the list.',
        breakdown: 'Choose a total to narrow the list.',
      }
      let nextEntryLimit = null
      function renderEntries(segs) {
        const card = document.getElementById('entries-card')
        card.hidden = !segs.length
        if (!segs.length) return
        const list = narrowedSegments(segs)
        const view = entryView()
        document.querySelectorAll('[data-entry-view]').forEach((b) => {
          const pressed = b.dataset.entryView === view
          b.setAttribute('aria-pressed', String(pressed))
          b.toggleAttribute('data-pressed', pressed)
        })
        const count = new Set(list.map((s) => s.entry.id)).size
        const summary = `<span class="tabular-nums">${count} ${count === 1 ? 'entry' : 'entries'} · ${hm(list.reduce((a, s) => a + s.ms, 0))}</span>`
        document.getElementById('entries-note').innerHTML = state.narrow
          ? `${summary}<span data-ui="badge" data-variant="secondary" class="max-w-full gap-1 py-0.5 pr-0.5 font-medium"><span class="truncate">${escapeHtml(narrowLabel())}</span><button type="button" id="entries-clear" class="rounded-sm p-0.5 hover:bg-background/60 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring" aria-label="Show all entries">${icon('x', 'size-3.5')}</button></span>`
          : `${summary}${narrowedOnce ? '' : `<span>${NARROW_HINT[state.view]}</span>`}`
        document.getElementById('entries-toggle').setAttribute('aria-expanded', String(entriesOpen))
        document.getElementById('entries-chevron').innerHTML = icon('chevron-down', `size-4 transition-transform ${entriesOpen ? '' : '-rotate-90'}`)
        document.getElementById('entries-views').hidden = !entriesOpen
        document.getElementById('entries-header').classList.toggle('pb-4', entriesOpen)
        if (!entriesOpen) {
          document.getElementById('entries').innerHTML = ''
          return
        }
        const { html, more, next } = (view === 'day' ? byDay : byDescription)(list, manyPeople())
        nextEntryLimit = next
        document.getElementById('entries').innerHTML = `<ul class="border-t">${html}</ul>${
          more ? `<div class="border-t px-4 py-2"><button type="button" id="entries-more" data-ui="button" data-variant="ghost" data-size="sm">${icon('chevron-down')}${escapeHtml(more)}</button></div>` : ''
        }`
      }

      // Changing a filter or the report's view starts the card over: the whole report, the list
      // that fits the range.
      let entriesFor = ''
      function resetEntriesOnFilterChange() {
        const key = JSON.stringify([state.view, state.from, state.to, state.scope, state.group, state.project, state.unit, state.fixture, role(), state.zone, state.weekStart])
        if (key === entriesFor) return
        entriesFor = key
        state.narrow = null
        state.entryView = null
        state.entryLimit = null
      }

      // Narrows the Entries card to a row, a bucket, or both; the same part again shows all.
      // `refocus` finds the control again after the render replaced it.
      function narrowTo(row, bucket, refocus) {
        const n = state.narrow
        state.narrow = n && n.row === row && n.bucket === bucket ? null : { row, bucket }
        state.entryLimit = null
        // Choosing a part asks for its entries, so it opens the list.
        if (state.narrow) {
          narrowedOnce = true
          writeFlag('snowtime.reportEntriesNarrowed', true)
          setEntriesOpen(true)
        }
        render()
        refocus()?.focus()
        const card = document.getElementById('entries-card')
        if (state.narrow && card.getBoundingClientRect().top > innerHeight * 0.75) card.scrollIntoView({ behavior: 'smooth', block: 'start' })
      }
      document.querySelector('main').addEventListener('click', (event) => {
        const b = event.target.closest('.ts-pick')
        if (!b) return
        // A total in a Breakdown row's summary doesn't also open or close the row.
        event.preventDefault()
        const row = b.dataset.row || null
        const bucket = b.dataset.bucket ? +b.dataset.bucket : null
        narrowTo(row, bucket, () => document.querySelector(`#panel-${state.view} .ts-pick[data-row="${row ?? ''}"][data-bucket="${bucket ?? ''}"]`))
      })
      document.getElementById('entries-card').addEventListener('click', (event) => {
        const view = event.target.closest('[data-entry-view]')
        if (event.target.closest('#entries-toggle')) {
          setEntriesOpen(!entriesOpen)
          render()
        } else if (view) {
          state.entryView = view.dataset.entryView
          state.entryLimit = null
          render()
        } else if (event.target.closest('#entries-clear')) {
          state.narrow = null
          state.entryLimit = null
          render()
          document.querySelector('[data-entry-view][aria-pressed="true"]').focus()
        } else if (event.target.closest('#entries-more')) {
          state.entryLimit = nextEntryLimit
          render()
        }
      })

      // --- Breakdown -----------------------------------------------------------------------
      const SUBGROUP = { project: 'member', ticket: 'member', member: 'project', team: 'member' }
      function renderOutline(segs) {
        const rows = rowsBy(segs, state.group)
        const total = segs.reduce((a, s) => a + s.ms, 0)
        const sub = appFrame.role === 'member' && state.group === 'project' ? null : SUBGROUP[state.group]
        document.getElementById('outline-title').textContent = `By ${groupNoun()}${sub ? `, then ${sub}` : ''}`
        document.getElementById('outline-note').textContent = teamNote()
        document.getElementById('outline-total').textContent = hm(total)
        const el = document.getElementById('outline')
        if (!rows.length) return (el.innerHTML = emptyState())
        // A top-level total narrows the Entries card. It sits over the row, outside the row's
        // <summary>, so the summary holds no button; its place in the line is kept empty.
        const line = (r, of, level) => `<div class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-4 gap-y-1 ${level ? 'text-sm' : ''}">
            <span class="flex min-w-0 items-center gap-2">${r.color ? dot(r.color) : ''}<span class="truncate ${level ? 'text-muted-foreground' : 'font-medium'} ${r.muted ? 'text-muted-foreground' : ''}">${escapeHtml(r.name)}</span>${r.archived ? '<span data-ui="badge" data-variant="outline" class="px-1.5 text-[10px]">Archived</span>' : ''}</span>
            <span class="flex items-baseline gap-3"><span class="w-10 text-right text-xs text-muted-foreground">${Math.round((r.total / of) * 100)}%</span><span class="w-14 text-right tabular-nums">${level ? hm(r.total) : ''}</span></span>
            <div class="col-span-2">${shareBar(r.total / of, r.color)}</div>
          </div>`
        const total0 = (r) => `<span class="absolute right-4 top-3 w-14 text-right tabular-nums">${pickButton(r.key, null, r.name, hm(r.total))}</span>`
        el.innerHTML = `<ul class="divide-y rounded-md border">${rows
          .map((r, i) => {
            const children = sub ? rowsBy(r.segs, sub) : []
            if (!children.length) return `<li class="relative px-4 py-3">${line(r, total, 0)}${total0(r)}</li>`
            return `<li class="relative"><details ${i < 3 ? 'open' : ''} class="group">
              <summary class="flex cursor-pointer items-start gap-2 px-4 py-3 hover:bg-muted/50 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-inset focus-visible:ring-ring">
                ${icon('chevron-right', 'mt-0.5 text-muted-foreground transition-transform group-open:rotate-90')}<div class="min-w-0 flex-1">${line(r, total, 0)}</div>
              </summary>
              <ul class="grid gap-3 pb-4 pl-10 pr-4">${children.map((c) => `<li>${line(c, r.total, 1)}</li>`).join('')}</ul>
            </details>${total0(r)}</li>`
          })
          .join('')}</ul>`
      }

      // --- Controls -----------------------------------------------------------------------------
      function renderControls() {
        document.getElementById('range-preset').value = state.preset
        document.getElementById('range-from').value = dateValue(state.from)
        document.getElementById('range-to').value = dateValue(Z.addDays(state.to, -1, state.zone))
        document.getElementById('export-button').innerHTML = `${icon('download')}Export`
        document.querySelector('[data-export="xlsx"]').innerHTML = `${icon('file-spreadsheet')}<span class="grid"><span>Excel (XLSX)</span><span class="text-xs text-muted-foreground">Entries and timesheet</span></span>`
        document.querySelector('[data-export="csv"]').innerHTML = `${icon('file-text')}<span class="grid"><span>Timesheet (CSV)</span><span class="text-xs text-muted-foreground">As shown, in decimal hours</span></span>`
        document.querySelector('[data-export="entries"]').innerHTML = `${icon('file-text')}<span class="grid"><span>Entries (CSV)</span><span class="text-xs text-muted-foreground">Each entry behind the report</span></span>`
        document.getElementById('range-prev').innerHTML = icon('chevron-left')
        document.getElementById('range-next').innerHTML = icon('chevron-right')
        document.querySelectorAll('[data-unit]').forEach((b) => {
          const pressed = b.dataset.unit === state.unit
          b.setAttribute('aria-pressed', String(pressed))
          b.toggleAttribute('data-pressed', pressed)
        })
        const isMember = role() === 'member'
        document.getElementById('scope-field').hidden = isMember
        document.getElementById('group-select').value = state.group
        document.getElementById('project').value = state.project ?? ''
        // Breakdown totals the whole range, so Totals per doesn't apply to it.
        document.querySelectorAll('[data-unit]').forEach((b) => (b.disabled = state.view === 'breakdown'))
        const note = {
          member: 'Your own time.',
          lead: `Your time and the time of the ${ledTeams().map((t) => t.name).join(', ')} team${ledTeams().length > 1 ? 's' : ''}, which you lead.`,
          admin: 'Everyone in the organization.',
          owner: 'Everyone in the organization.',
        }[role()]
        document.getElementById('scope-note').innerHTML = `${escapeHtml(rangeLabel())} · ${escapeHtml(note)} Days and weeks in ${escapeHtml(state.zone.replaceAll('_', ' '))}, starting ${state.weekStart === 'sun' ? 'Sunday' : 'Monday'} (<a href="${appFrame.link('settings.html#preferences')}" data-frame-link="settings.html#preferences" class="underline underline-offset-4 hover:text-foreground">change</a>).`
      }

      function render() {
        document.getElementById('export-status').textContent = ''
        resetEntriesOnFilterChange()
        renderControls()
        const { segs, split } = segments()
        const splitNote = document.getElementById('split-note')
        splitNote.hidden = !split
        splitNote.innerHTML = `${icon('moon', 'mt-0.5')}<span>${split} ${split === 1 ? 'entry crosses' : 'entries cross'} midnight and ${split === 1 ? 'is' : 'are'} split between days.</span>`
        if (state.view === 'summary') {
          renderStats(segs)
          renderChart(segs)
          renderSummaryBreakdown(segs)
        } else if (state.view === 'timesheet') renderTimesheet(segs)
        else renderOutline(segs)
        renderEntries(segs)
      }

      function loadOrg() {
        state.org = appData.organization({ role: role(), long: state.fixture === 'long' })
        state.entries = state.fixture === 'empty' ? [] : appData.generateEntries(state.org)
        document.getElementById('scope').innerHTML = role() === 'member' ? '' : scopeOptions()
        state.scope = 'default'
        document.getElementById('project').innerHTML = projectOptions()
        state.project = null
        // Members group their own time by project or ticket only.
        const own = role() === 'member'
        for (const option of document.getElementById('group-select').options) option.hidden = own && (option.value === 'team' || option.value === 'member')
        if (own && (state.group === 'team' || state.group === 'member')) state.group = 'project'
      }

      document.getElementById('range-preset').addEventListener('change', (event) => {
        if (event.currentTarget.value === 'custom') state.preset = 'custom'
        else setPreset(event.currentTarget.value)
        render()
      })
      document.getElementById('range-prev').addEventListener('click', () => (shiftRange(-1), render()))
      document.getElementById('range-next').addEventListener('click', () => (shiftRange(1), render()))
      for (const id of ['range-from', 'range-to'])
        document.getElementById(id).addEventListener('change', () => {
          const from = document.getElementById('range-from').value
          const to = document.getElementById('range-to').value
          if (!from || !to) return
          let a = fromDateValue(from)
          let b = Z.addDays(fromDateValue(to), 1, state.zone)
          if (b <= a) [a, b] = [fromDateValue(to), Z.addDays(fromDateValue(from), 1, state.zone)]
          state.from = a
          state.to = b
          state.preset = matchPreset()
          state.unit = daysInRange() > 35 ? 'week' : state.unit
          render()
        })
      document.getElementById('scope').addEventListener('change', (event) => {
        state.scope = event.currentTarget.value
        render()
      })
      document.getElementById('group-select').addEventListener('change', (event) => {
        state.group = event.currentTarget.value
        render()
      })
      document.getElementById('project').addEventListener('change', (event) => {
        state.project = event.currentTarget.value || null
        render()
      })
      document.querySelectorAll('[data-unit]').forEach((b) =>
        b.addEventListener('click', () => {
          state.unit = b.dataset.unit
          render()
        })
      )
      document.getElementById('view-tabs').addEventListener('change', (event) => {
        state.view = event.detail.dataset.view
        if (state.org) render()
      })
      document.getElementById('fixture').addEventListener('change', (event) => {
        state.fixture = event.currentTarget.value
        loadOrg()
        render()
      })
      appFrame.on('settings', () => {
        const { timeZone, weekStart } = appFrame.settings.get()
        if (timeZone === state.zone && weekStart === state.weekStart) return
        state.zone = timeZone
        state.weekStart = weekStart
        setPreset(state.preset === 'custom' ? 'this-week' : state.preset)
        render()
      })
      appFrame.on('role', () => {
        loadOrg()
        render()
      })

      // Export (prototype only): names the file the app would download. The file name is the
      // organization's short name and the range's first and last days.
      function exportName(kind) {
        const day = (ms) => new Intl.DateTimeFormat('en-CA', { timeZone: state.zone }).format(ms)
        const range = `${day(state.from)}-to-${day(Z.addDays(state.to, -1, state.zone))}`
        const base = `${appFrame.org.id}-${range}`
        return kind === 'xlsx' ? `${base}.xlsx` : kind === 'entries' ? `${base}-entries.csv` : `${base}.csv`
      }
      document.querySelectorAll('[data-export]').forEach((item) =>
        item.addEventListener('click', () => {
          document.getElementById('export-status').textContent = `Prototype: the app downloads ${exportName(item.dataset.export)}.`
        })
      )

      ui.ready.then(() => {
        loadOrg()
        setPreset('this-month')
        render()
      })
    </script>
  </body>
</html>
