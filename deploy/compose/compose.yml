name: snowtime
services:
  app:
    image: snowtime-app:${RELEASE:-local}
    build:
      context: ../..
      target: app
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      TURSO_DATABASE_URL: file:/data/snowtime.db
      BETTER_AUTH_URL: https://${APP_HOST:?Set APP_HOST in .env}
      CLIENT_IP_HEADER: cf-connecting-ip
      MIGRATE_ON_START: 'true'
      MIGRATIONS_DIR: /app/drizzle
    volumes:
      - app_data:/data
    expose:
      - '3000'
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:3000/sign-in']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
  caddy:
    image: snowtime-caddy:${RELEASE:-local}
    build:
      context: ../..
      target: caddy
    restart: unless-stopped
    environment:
      APP_HOST: ${APP_HOST:?Set APP_HOST in .env}
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  app_data:
    name: ${DATABASE_VOLUME:-snowtime_demo_data}
  caddy_data:
  caddy_config:
