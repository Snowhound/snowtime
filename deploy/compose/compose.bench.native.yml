# The native backend (task 081) in the app's place on the local bench stack, with the same
# database, limits, and environment. The host binary defaults to snowtime-axum;
# NATIVE_BIN overrides it when building: perf:stress --app=native adds this file.
services:
  app:
    image: snowtime-native:bench
    environment:
      EDGE_COMPRESSION: 'false'
      EDGE_ACCESS_LOG: 'off'
      EDGE_HEADERS: 'false'
      DB_READ_CONNECTIONS: ${BENCH_READ_CONNECTIONS:-0}
      TOKIO_RUNTIME: ${BENCH_TOKIO_RUNTIME:-multi_thread}
      WORK_QUEUE_MAX_WAITING: ${BENCH_QUEUE_MAX_WAITING:-128}
      WORK_QUEUE_TIMEOUT_MS: ${BENCH_QUEUE_TIMEOUT_MS:-1000}
      MIGRATIONS_DIR: /migrations
    volumes:
      - ../../drizzle:/migrations:ro
    healthcheck:
      test: ['CMD', 'curl', '-fsS', '-o', '/dev/null', 'http://localhost:3000/api/v1/availability']
